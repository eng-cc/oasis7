name: Compile Metrics

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Optional baseline git ref or SHA to compare against. Empty runs current-only metrics."
        required: false
        default: ""
        type: string
      metric_target:
        description: "Rust package compile surface to measure"
        required: true
        default: launcher
        type: choice
        options:
          - launcher
          - oasis7_node_no_default_features
      max_package_count_regression_pct:
        description: "Allowed package closure regression percentage"
        required: false
        default: "5"
        type: string
      max_cargo_check_regression_pct:
        description: "Allowed cold cargo check regression percentage"
        required: false
        default: ""
        type: string
      max_cargo_build_release_regression_pct:
        description: "Allowed cold cargo build --release regression percentage"
        required: false
        default: ""
        type: string
      max_release_binary_bytes_regression_pct:
        description: "Allowed release binary size regression percentage"
        required: false
        default: "3"
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  COMPILE_METRICS_MAX_PACKAGE_COUNT_REGRESSION_PCT: "5"
  COMPILE_METRICS_MAX_CARGO_CHECK_REGRESSION_PCT: ""
  COMPILE_METRICS_MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT: ""
  COMPILE_METRICS_MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT: "3"

jobs:
  compile-metrics:
    name: compile-metrics-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Current-only measurements never inspect repository history. Fetch a
          # baseline explicitly below when one is requested instead of paying
          # the full-history transfer cost on every run.
          fetch-depth: 1

      - name: Fetch baseline ref
        if: ${{ inputs.baseline_ref != '' }}
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASELINE_REF}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compile-metrics-${{ runner.os }}-rust-surface-v2
          cache-on-failure: true

      - name: Resolve baseline ref
        id: baseline
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          baseline_ref="${BASELINE_REF}"
          if [[ -n "${baseline_ref}" ]]; then
            # Use FETCH_HEAD so branch, tag, and SHA inputs all resolve to the
            # exact object fetched above, even in the shallow checkout.
            baseline_ref="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          fi
          echo "baseline_ref=${baseline_ref}" >> "${GITHUB_OUTPUT}"
          echo "baseline_ref=${baseline_ref}"

      - name: Measure selected Rust compile metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "output/compile-metrics/${{ matrix.platform }}"
          package=""
          binary=""
          extra_args=()
          case "${{ inputs.metric_target }}" in
            launcher)
              package="oasis7_client_launcher"
              binary="oasis7_client_launcher"
              ;;
            oasis7_node_no_default_features)
              package="oasis7_node"
              extra_args+=(--check-only --no-default-features)
              ;;
            *)
              echo "error: unsupported metric target: ${{ inputs.metric_target }}" >&2
              exit 2
              ;;
          esac
          cmd=(
            ./scripts/ci-compile-metrics.sh
            --package "${package}"
            --out-dir "output/compile-metrics/${{ matrix.platform }}"
          )
          if [[ -n "${binary}" ]]; then
            cmd+=(--binary "${binary}")
          fi
          cmd+=("${extra_args[@]}")
          if [[ -n "${{ steps.baseline.outputs.baseline_ref }}" ]]; then
            cmd+=(--baseline-ref "${{ steps.baseline.outputs.baseline_ref }}")
          fi
          "${cmd[@]}"

      - name: Append platform summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.platform }}"
            cat "output/compile-metrics/${{ matrix.platform }}/summary.md"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compile metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-metrics-${{ matrix.platform }}
          path: output/compile-metrics/${{ matrix.platform }}
          if-no-files-found: error

      - name: Enforce compile metrics gate
        if: ${{ always() && steps.baseline.outputs.baseline_ref != '' }}
        shell: bash
        env:
          MAX_PACKAGE_COUNT_REGRESSION_PCT: ${{ inputs.max_package_count_regression_pct }}
          MAX_CARGO_CHECK_REGRESSION_PCT: ${{ inputs.max_cargo_check_regression_pct }}
          MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT: ${{ inputs.max_cargo_build_release_regression_pct }}
          MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT: ${{ inputs.max_release_binary_bytes_regression_pct }}
        run: |
          set -euo pipefail
          cmd=(
            python3 ./scripts/ci-compile-metrics-gate.py
            --comparison "output/compile-metrics/${{ matrix.platform }}/comparison.json" \
            --max-package-count-regression-pct "${MAX_PACKAGE_COUNT_REGRESSION_PCT}"
          )
          if [[ "${{ inputs.metric_target }}" == "launcher" ]]; then
            cmd+=(
              --max-release-binary-bytes-regression-pct "${MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT}"
              --require-wasmtime-absent
            )
          fi
          if [[ -n "${MAX_CARGO_CHECK_REGRESSION_PCT}" ]]; then
            cmd+=(--max-cargo-check-regression-pct "${MAX_CARGO_CHECK_REGRESSION_PCT}")
          fi
          if [[ -n "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}" ]]; then
            cmd+=(--max-cargo-build-release-regression-pct "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}")
          fi
          "${cmd[@]}"

  summarize:
    name: summarize-compile-metrics
    needs: compile-metrics
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download compile metrics artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: compile-metrics-*
          path: output/compile-metrics

      - name: Write combined summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Compile Metrics Summary"
            echo
            find output/compile-metrics -name summary.md -print | sort | while read -r summary; do
              echo "## $(basename "$(dirname "$summary")")"
              cat "$summary"
              echo
            done
          } > output/compile-metrics/combined-summary.md
          cat output/compile-metrics/combined-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload combined compile metrics summary
        uses: actions/upload-artifact@v7
        with:
          name: compile-metrics-summary
          path: output/compile-metrics/combined-summary.md
          if-no-files-found: error
