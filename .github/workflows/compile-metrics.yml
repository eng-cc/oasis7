name: Compile Metrics

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/workflows/compile-metrics.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Optional baseline git ref or SHA to compare against. Empty uses the PR base on pull_request, otherwise current-only metrics."
        required: false
        default: ""
        type: string
      max_package_count_regression_pct:
        description: "Allowed package closure regression percentage"
        required: false
        default: "5"
        type: string
      max_cargo_check_regression_pct:
        description: "Allowed cold cargo check regression percentage"
        required: false
        default: ""
        type: string
      max_cargo_build_release_regression_pct:
        description: "Allowed cold cargo build --release regression percentage"
        required: false
        default: ""
        type: string
      max_release_binary_bytes_regression_pct:
        description: "Allowed release binary size regression percentage"
        required: false
        default: "3"
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  COMPILE_METRICS_MAX_PACKAGE_COUNT_REGRESSION_PCT: "5"
  COMPILE_METRICS_MAX_CARGO_CHECK_REGRESSION_PCT: ""
  COMPILE_METRICS_MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT: ""
  COMPILE_METRICS_MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT: "3"

jobs:
  compile-metrics:
    name: compile-metrics-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compile-metrics-${{ runner.os }}-launcher-v1
          cache-on-failure: true

      - name: Resolve baseline ref
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_ref="${{ inputs.baseline_ref }}"
          if [[ -z "${baseline_ref}" && "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            baseline_ref="${{ github.event.pull_request.base.sha }}"
          fi
          echo "baseline_ref=${baseline_ref}" >> "${GITHUB_OUTPUT}"
          echo "baseline_ref=${baseline_ref}"

      - name: Measure launcher compile metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "output/compile-metrics/${{ matrix.platform }}"
          cmd=(
            ./scripts/ci-compile-metrics.sh
            --package oasis7_client_launcher
            --binary oasis7_client_launcher
            --out-dir "output/compile-metrics/${{ matrix.platform }}"
          )
          if [[ -n "${{ steps.baseline.outputs.baseline_ref }}" ]]; then
            cmd+=(--baseline-ref "${{ steps.baseline.outputs.baseline_ref }}")
          fi
          "${cmd[@]}"

      - name: Append platform summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.platform }}"
            cat "output/compile-metrics/${{ matrix.platform }}/summary.md"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compile metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-metrics-${{ matrix.platform }}
          path: output/compile-metrics/${{ matrix.platform }}
          if-no-files-found: error

      - name: Enforce compile metrics gate
        if: ${{ always() && steps.baseline.outputs.baseline_ref != '' }}
        shell: bash
        env:
          MAX_PACKAGE_COUNT_REGRESSION_PCT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_package_count_regression_pct || env.COMPILE_METRICS_MAX_PACKAGE_COUNT_REGRESSION_PCT }}
          MAX_CARGO_CHECK_REGRESSION_PCT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_cargo_check_regression_pct || env.COMPILE_METRICS_MAX_CARGO_CHECK_REGRESSION_PCT }}
          MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_cargo_build_release_regression_pct || env.COMPILE_METRICS_MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT }}
          MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_release_binary_bytes_regression_pct || env.COMPILE_METRICS_MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT }}
        run: |
          set -euo pipefail
          cmd=(
            python3 ./scripts/ci-compile-metrics-gate.py
            --comparison "output/compile-metrics/${{ matrix.platform }}/comparison.json" \
            --max-package-count-regression-pct "${MAX_PACKAGE_COUNT_REGRESSION_PCT}" \
            --max-release-binary-bytes-regression-pct "${MAX_RELEASE_BINARY_BYTES_REGRESSION_PCT}" \
            --require-wasmtime-absent
          )
          if [[ -n "${MAX_CARGO_CHECK_REGRESSION_PCT}" ]]; then
            cmd+=(--max-cargo-check-regression-pct "${MAX_CARGO_CHECK_REGRESSION_PCT}")
          fi
          if [[ -n "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}" ]]; then
            cmd+=(--max-cargo-build-release-regression-pct "${MAX_CARGO_BUILD_RELEASE_REGRESSION_PCT}")
          fi
          "${cmd[@]}"

  summarize:
    name: summarize-compile-metrics
    needs: compile-metrics
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download compile metrics artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: compile-metrics-*
          path: output/compile-metrics

      - name: Write combined summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Compile Metrics Summary"
            echo
            find output/compile-metrics -name summary.md -print | sort | while read -r summary; do
              echo "## $(basename "$(dirname "$summary")")"
              cat "$summary"
              echo
            done
          } > output/compile-metrics/combined-summary.md
          cat output/compile-metrics/combined-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload combined compile metrics summary
        uses: actions/upload-artifact@v7
        with:
          name: compile-metrics-summary
          path: output/compile-metrics/combined-summary.md
          if-no-files-found: error
