name: Rust
run-name: oasis7-ci|${{ github.event_name }}|${{ inputs.run_mode }}|${{ inputs.task_uid }}|${{ inputs.pr_number }}|${{ inputs.integration_base }}|${{ inputs.expected_head }}${{ inputs.request_key != '' && format('|{0}', inputs.request_key) || '' }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual Rust workflow mode"
        required: true
        default: full_escalation
        type: choice
        options:
          - integration_revalidation
          - full_escalation
          - newapi_bridge_package
          - v1_reuse_validation_only
      newapi_bridge_build_profile:
        description: "Cargo profile when run_mode=newapi_bridge_package"
        required: true
        default: release
        type: choice
        options:
          - release
          - dev
      task_uid:
        description: "Required for full_escalation: GitHub Project task UID"
        required: false
        type: string
      pr_number:
        description: "Required for full_escalation: PR number bound to the escalation"
        required: false
        type: string
      expected_head:
        description: "Required for full_escalation: exact checked-out commit SHA"
        required: false
        type: string
      integration_base:
        description: "Frozen B OID for integration or validation-only runs"
        required: false
        type: string
      source_scope_oid:
        description: "Frozen S OID for v1_reuse_validation_only"
        required: false
        type: string
      projection_digest:
        description: "Frozen trusted projection D for v1_reuse_validation_only"
        required: false
        type: string
      escalation_reason:
        description: "Required for full_escalation: release|high_risk|history_defect|signal"
        required: false
        type: string
      evidence_url:
        description: "Required for full_escalation: same-repository issue-comment evidence URL"
        required: false
        type: string
      impact_projection_b64:
        description: "Required for integration_revalidation: base64 encoded verified workflow impact projection"
        required: false
        type: string
      request_key:
        description: "Keyed C4 identity or v1 validation_id assertion"
        required: false
        type: string
      validation_request_b64:
        description: "Optional canonical C3 validation request envelope; requires request_key"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort

jobs:
  required-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      execution_contract: ${{ steps.scope.outputs.execution_contract }}
      required_plan_v2_artifact_id: ${{ steps.upload-plan-v2.outputs.artifact-id }}
      required_plan_v2_artifact_name: ${{ steps.keyed-plan.outputs.plan_artifact_name }}
      required_unit_matrix: ${{ steps.keyed-plan.outputs.unit_matrix }}
      run_operational_contracts: ${{ steps.scope.outputs.run_operational_contracts }}
      run_workflow_governance_contracts: ${{ steps.scope.outputs.run_workflow_governance_contracts }}
      run_packaging_contracts: ${{ steps.scope.outputs.run_packaging_contracts }}
      run_doc_checker_contracts: ${{ steps.scope.outputs.run_doc_checker_contracts }}
      run_cargo_tooling_contracts: ${{ steps.scope.outputs.run_cargo_tooling_contracts }}
      run_site_contract_tests: ${{ steps.scope.outputs.run_site_contract_tests }}
      checker_stage_pr_number: ${{ steps.checker-stage.outputs.pr_number }}
      checker_stage_task_uid: ${{ steps.checker-stage.outputs.task_uid }}
      checker_stage_integration_base_oid: ${{ steps.scope.outputs.integration_base_oid }}
      checker_stage_head_oid: ${{ steps.scope.outputs.head_oid }}
      checker_stage_source_scope_oid: ${{ steps.scope.outputs.source_scope_base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: impact
        name: Materialize PR workflow impact projection
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -I - <<'PY'
          import base64, os, pathlib, re
          matches=re.findall(r'<!-- oasis7-impact-projection-b64: ([A-Za-z0-9+/=]+|missing) -->',os.environ.get('PR_BODY',''))
          if len(matches)>1:
              raise SystemExit('pull request has duplicate workflow impact projection markers')
          enabled=bool(matches and matches[0]!='missing')
          if enabled:
              pathlib.Path(os.environ['RUNNER_TEMP'],'impact-projection.json').write_bytes(base64.b64decode(matches[0],validate=True))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
          PY
      - id: integration
        name: Prepare exact manual integration from trusted default workflow
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation'
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_BASE: ${{ inputs.integration_base }}
          INTEGRATION_HEAD: ${{ inputs.expected_head }}
          INTEGRATION_UID: ${{ inputs.task_uid }}
          INTEGRATION_PR: ${{ inputs.pr_number }}
          INTEGRATION_REQUEST_KEY: ${{ inputs.request_key }}
          INTEGRATION_REQUEST_B64: ${{ inputs.validation_request_b64 }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/integration-planner/pm"
          cp scripts/plan-rust-required-scope.py scripts/ci-required-scope.v2.json scripts/ci-tests.sh scripts/viewer-dependency-preflight.sh "${RUNNER_TEMP}/integration-planner/"
          cp scripts/pm/workflow-impact-projection.py "${RUNNER_TEMP}/integration-planner/pm/"
          cp scripts/pm/integration_ci.py scripts/pm/integration_executor_contract.py scripts/pm/ci_ready_receipt_identity.py "${RUNNER_TEMP}/"
          [[ -n '${{ inputs.impact_projection_b64 }}' ]] || {
            echo "integration_revalidation requires impact_projection_b64" >&2
            exit 1
          }
          printf '%s' '${{ inputs.impact_projection_b64 }}' | base64 --decode >"${RUNNER_TEMP}/impact-projection.json"
          prepare_args=(prepare --repository "${GITHUB_REPOSITORY}" --task-uid "${INTEGRATION_UID}" \
            --pr-number "${INTEGRATION_PR}" --base "${INTEGRATION_BASE}" --head "${INTEGRATION_HEAD}" \
            --output "${RUNNER_TEMP}/integration.json")
          if [[ -n "${INTEGRATION_REQUEST_KEY}" || -n "${INTEGRATION_REQUEST_B64}" ]]; then
            [[ -n "${INTEGRATION_REQUEST_KEY}" && -n "${INTEGRATION_REQUEST_B64}" ]] || {
              echo "keyed integration requires both request_key and validation_request_b64" >&2
              exit 1
            }
            [[ "${INTEGRATION_REQUEST_KEY}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "request_key must be a canonical SHA-256 identity" >&2
              exit 1
            }
            python3 -I scripts/pm/ci_reuse_policy.py trusted-context --root "${GITHUB_WORKSPACE}" \
              --repository "${GITHUB_REPOSITORY}" --default-branch "${GITHUB_DEFAULT_BRANCH}" \
              --workflow-ref "${GITHUB_WORKFLOW_REF}" --workflow-sha "${GITHUB_WORKFLOW_SHA}" \
              --default-branch-sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/trusted-ci-policy.json"
            prepare_args+=(--request-key "${INTEGRATION_REQUEST_KEY}" \
              --validation-request-b64 "${INTEGRATION_REQUEST_B64}" \
              --trusted-policy-json "${RUNNER_TEMP}/trusted-ci-policy.json" \
              --integration-worktree "${RUNNER_TEMP}/integration-target")
          fi
          python3 -I "${RUNNER_TEMP}/integration_ci.py" "${prepare_args[@]}"
          echo "identity=$(cat "${RUNNER_TEMP}/integration.json")" >>"${GITHUB_OUTPUT}"
          python3 -I - "${RUNNER_TEMP}/integration.json" "${GITHUB_OUTPUT}" <<'PY'
          import json, pathlib, sys
          identity=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[2]).open("a",encoding="utf-8") as output:
              output.write("worktree="+identity.get("integration_worktree","")+"\n")
          PY
      - name: Validate trusted loop repository scope and content
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_ref=""
          head_ref="${GITHUB_SHA}"
          case "${GITHUB_EVENT_NAME}" in
            pull_request|workflow_dispatch)
              base_ref="${{ github.event.pull_request.base.sha || inputs.integration_base }}"
              head_ref="${{ github.event.pull_request.head.sha || inputs.expected_head }}"
              if git show "${base_ref}:scripts/pm/loop-ci.py" >"${RUNNER_TEMP}/oasis7-loop-ci.py"; then
                python3 "${RUNNER_TEMP}/oasis7-loop-ci.py" --repository "${{ github.repository }}" \
                  --pr-number "${{ github.event.pull_request.number || inputs.pr_number }}" \
                  --base "${base_ref}" --head "${head_ref}"
              else
                # Bootstrap compatibility: old base has no loop admission. Only
                # a reciprocal live legacy task may pass; never run candidate helpers.
                python3 -I - "${{ github.repository }}" "${{ github.event.pull_request.number || inputs.pr_number }}" <<'PY'
          import json,re,subprocess,sys
          repo,number=sys.argv[1:]
          pr=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/pulls/{number}'],text=True))
          uids=set(re.findall(r'task_[0-9a-f]{32}',pr.get('body') or ''))
          if len(uids)==1:
              uid=next(iter(uids))
              refs=set(re.findall(r'(?:Refs|Fixes|Closes)\s+#(\d+)',pr.get('body') or '',re.I))
              if len(refs)>20: raise SystemExit('task reference discovery budget exhausted')
              if refs:
                  candidates=sorted(refs)
              else:
                  hits=json.loads(subprocess.check_output(['gh','issue','list','-R',repo,'--state','all','--search',uid+' in:body','--json','number','--limit','5'],text=True))
                  if not isinstance(hits,list) or len(hits)>=5: raise SystemExit('task search discovery incomplete')
                  candidates=[hit['number'] for hit in hits]
              matches=[]
              for candidate in candidates:
                  item=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/issues/{candidate}'],text=True))
                  candidate_body=(item.get('body') or '').replace('\r\n','\n')
                  candidate_fields=re.findall(r'^task_uid:[^\n]*$',candidate_body,re.M)
                  candidate_uids=re.findall(r'^task_uid: (task_[0-9a-f]{32})$',candidate_body,re.M)
                  if uid in candidate_uids:
                      if candidate_fields!=['task_uid: '+uid] or candidate_uids!=[uid]: raise SystemExit('ambiguous canonical Issue UID')
                      matches.append(candidate)
              if len(matches)!=1: raise SystemExit('live task Issue is ambiguous or missing')
              issue_number=matches[0]
          else:
              refs=set(re.findall(r'(?:Refs|Fixes|Closes)\s+#(\d+)',pr.get('body') or '',re.I))
              if uids or len(refs)!=1: raise SystemExit('missing unique live task Issue identity')
              issue_number,uid=next(iter(refs)),None
          issue=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/issues/{issue_number}'],text=True))
          body=(issue.get('body') or '').replace('\r\n','\n')
          issue_fields=re.findall(r'^task_uid:[^\n]*$',body,re.M)
          issue_uids=re.findall(r'^task_uid: (task_[0-9a-f]{32})$',body,re.M)
          if len(issue_fields)!=1 or len(issue_uids)!=1 or (uid is not None and issue_uids!=[uid]): raise SystemExit('task UID identity mismatch')
          if re.findall(r'^- pr_number: `([0-9]+)`$',body,re.M)!=[number]: raise SystemExit('task PR identity mismatch')
          if 'loop_binding_b64:' in body: raise SystemExit('effective base lacks loop admission; activation blocked')
          pages=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/issues/{issue_number}/comments','--paginate','--slurp'],text=True))
          if not isinstance(pages,list): raise SystemExit('lineage readback unavailable')
          comments=[item for page in pages for item in (page if isinstance(page,list) else [page])]
          if any('oasis7-loop-binding-history' in str(item.get('body','')) for item in comments if isinstance(item,dict)): raise SystemExit('loop binding deleted after history')
          print('loop admission: live legacy bootstrap')
          PY
              fi
              ;;
            push)
              base_ref="${{ github.event.before }}"
              ;;
          esac

      - id: checker-stage
        name: Classify trusted checker-stage route
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation')
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.integration_base }}
          CHECKER_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          CHECKER_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CHECKER_TASK_UID_INPUT: ${{ inputs.task_uid }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          checker_paths=(
            "scripts/pm/check-cargo-package-scope"
            "scripts/pm/check-cargo-package-scope.test.py"
          )
          if [[ -z "${CHECKER_BASE_SHA}" || -z "${CHECKER_HEAD_SHA}" ]]; then
            echo "checker-stage changed-path range is incomplete" >&2
            exit 1
          fi
          changed_status_file="$(mktemp)"
          trap 'rm -f "${changed_status_file}"' EXIT
          if ! git diff --name-status --find-renames --find-copies --find-copies-harder "${CHECKER_BASE_SHA}" "${CHECKER_HEAD_SHA}" >"${changed_status_file}"; then
            echo "checker-stage changed-path readback failed for the supplied range" >&2
            exit 1
          fi
          checker_stage_path_route() {
            local status_file="$1"
            local status first_path second_path path
            local checker_path_touched=false
            local checker_non_modification=false
            local -a changed_paths=()
            while IFS=$'\t' read -r status first_path second_path; do
              [[ -n "${status}" ]] || continue
              case "${status}" in
                R*|C*)
                  [[ -n "${first_path}" && -n "${second_path}" ]] || {
                    echo "checker-stage changed-path record is malformed" >&2
                    return 1
                  }
                  changed_paths+=("${first_path}" "${second_path}")
                  checker_non_modification=true
                  ;;
                M)
                  [[ -n "${first_path}" && -z "${second_path}" ]] || {
                    echo "checker-stage changed-path record is malformed" >&2
                    return 1
                  }
                  changed_paths+=("${first_path}")
                  ;;
                *)
                  [[ -n "${first_path}" && -z "${second_path}" ]] || {
                    echo "checker-stage changed-path record is malformed" >&2
                    return 1
                  }
                  changed_paths+=("${first_path}")
                  checker_non_modification=true
                  ;;
              esac
            done <"${status_file}"
            for path in "${changed_paths[@]}"; do
              if [[ "${path}" == "${checker_paths[0]}" || "${path}" == "${checker_paths[1]}" ]]; then
                checker_path_touched=true
              fi
            done
            if [[ "${checker_path_touched}" != true ]]; then
              echo ordinary
              return 0
            fi
            if [[ "${checker_non_modification}" == true ]]; then
              echo "checker-stage rename/copy or non-modification changes are not admissible" >&2
              return 1
            fi
            if (( ${#changed_paths[@]} != 2 )); then
              echo "checker-stage path touched without the exact two-file checker scope" >&2
              return 1
            fi
            if [[ ( "${changed_paths[0]}" != "${checker_paths[0]}" && "${changed_paths[0]}" != "${checker_paths[1]}" ) ||
                  ( "${changed_paths[1]}" != "${checker_paths[0]}" && "${changed_paths[1]}" != "${checker_paths[1]}" ) ]]; then
              echo "checker-stage path touched without the exact two-file checker scope" >&2
              return 1
            fi
            echo checker
          }
          changed_path_route="$(checker_stage_path_route "${changed_status_file}")" || exit 1
          if [[ "${changed_path_route}" == ordinary ]]; then
            {
              echo "pr_number="
              echo "task_uid="
              echo "receipt="
            } >>"${GITHUB_OUTPUT}"
            echo "ordinary changed-path route: checker stage is not selected"
            exit 0
          fi
          if [[ "${changed_path_route}" != checker ]]; then
            echo "checker-stage path route could not be classified" >&2
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY}" != "eng-cc/oasis7" ]]; then
            echo "checker-stage authority is unavailable outside the canonical repository" >&2
            exit 1
          fi
          candidate_task_uid="${CHECKER_TASK_UID_INPUT:-}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            candidate_task_uid="$(PR_BODY="${PR_BODY:-}" python3 -I - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "").replace("\r\n", "\n")
          task_lines = re.findall(r"^Task:[^\n]*$", body, re.M)
          task_uids = re.findall(r"^Task: (task_[0-9a-f]{32})$", body, re.M)
          if len(task_lines) != 1 or len(task_uids) != 1:
              raise SystemExit("candidate checker PR task UID is missing or ambiguous")
          print(task_uids[0])
          PY
          )"
          fi
          trusted_classifier="${RUNNER_TEMP}/trusted-cargo-checker-stage-admission.py"
          if ! git show "${CHECKER_BASE_SHA}:scripts/pm/cargo_checker_stage_admission.py" >"${trusted_classifier}"; then
            echo "trusted checker-stage classifier is unavailable from the integration base" >&2
            exit 1
          fi
          chmod +x "${trusted_classifier}"
          resolved_identity="$(python3 -I "${trusted_classifier}" classify \
            --repository "${GITHUB_REPOSITORY}" --pr-number "${CHECKER_PR_NUMBER}" \
            --task-uid "${candidate_task_uid}" --repo-root "${GITHUB_WORKSPACE}" \
            --base "${CHECKER_BASE_SHA}" --head "${CHECKER_HEAD_SHA}")"
          read -r resolved_pr resolved_task_uid <<<"${resolved_identity}"
          [[ "${resolved_pr}" == "${CHECKER_PR_NUMBER}" && "${resolved_task_uid}" == "${candidate_task_uid}" ]] || {
            echo "trusted checker-stage identity does not match the current PR event" >&2
            exit 1
          }
          {
            echo "pr_number=${CHECKER_PR_NUMBER}"
            echo "task_uid=${resolved_task_uid}"
          } >>"${GITHUB_OUTPUT}"
          echo "trusted checker-stage route selected for PR ${CHECKER_PR_NUMBER}"

      - id: scope
        name: Plan required gate scope
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base_ref=""
          head_ref="${GITHUB_SHA}"
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base_ref="${{ github.event.pull_request.base.sha }}"
              head_ref="${{ github.event.pull_request.head.sha }}"
              ;;
            workflow_dispatch)
              base_ref="${{ inputs.integration_base }}"
              head_ref="${{ inputs.expected_head }}"
              ;;
            push)
              base_ref="${{ github.event.before }}"
              ;;
          esac
          planner=(./scripts/plan-rust-required-scope.sh)
          impact_args=()
          run_mode_args=()
          scope_base_oid="$(git merge-base "${base_ref}" "${head_ref}")"
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            authority_dir="${RUNNER_TEMP}/required-base-authority"
            mkdir -p "${authority_dir}/pm"
            git show "${base_ref}:scripts/plan-rust-required-scope.py" >"${authority_dir}/plan-rust-required-scope.py"
            git show "${base_ref}:scripts/ci-required-scope.v2.json" >"${authority_dir}/ci-required-scope.v2.json"
            git show "${base_ref}:scripts/ci-tests.sh" >"${authority_dir}/ci-tests.sh"
            git show "${base_ref}:scripts/pm/workflow-impact-projection.py" >"${authority_dir}/pm/workflow-impact-projection.py"
            planner=(python3 -I "${authority_dir}/plan-rust-required-scope.py")
            if [[ -f "${RUNNER_TEMP}/impact-projection.json" ]]; then
              task_uid="$(python3 - <<'PY'
          import os,re
          matches=re.findall(r'^Task: (task_[0-9a-f]{32})$',os.environ.get('PR_BODY',''),re.M)
          if len(matches)!=1: raise SystemExit('pull request requires exactly one canonical Task UID')
          print(matches[0])
          PY
              )"
              impact_args=(--impact-projection "${RUNNER_TEMP}/impact-projection.json" --task-uid "${task_uid}" --scope-base-oid "${scope_base_oid}")
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            planner=(python3 -I "${RUNNER_TEMP}/integration-planner/plan-rust-required-scope.py")
            task_uid="${{ inputs.task_uid }}"
            run_mode_args=(--run-mode "${{ inputs.run_mode }}")
            impact_args=(
              --impact-projection "${RUNNER_TEMP}/impact-projection.json"
              --task-uid "${{ inputs.task_uid }}"
              --scope-base-oid "${scope_base_oid}"
            )
          fi
          "${planner[@]}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            "${run_mode_args[@]}" \
            --base-ref "${base_ref}" \
            --head-ref "${head_ref}" \
            "${impact_args[@]}" \
            --github-output "${GITHUB_OUTPUT}"
          source_scope_base="$(git merge-base "${base_ref}" "${head_ref}")"
          {
            echo "base_oid=${base_ref}"
            echo "integration_base_oid=${base_ref}"
            echo "head_oid=${head_ref}"
            echo "source_scope_base=${source_scope_base}"
            echo "integration_base=${base_ref}"
            echo "source_head=${head_ref}"
            echo "task_uid=${task_uid}"
          } >>"${GITHUB_OUTPUT}"
      - name: Report planned scope
        run: |
          echo "execution_contract=${{ steps.scope.outputs.execution_contract }}"
          echo "scope=${{ steps.scope.outputs.scope }}"
          echo "selected_capabilities=${{ steps.scope.outputs.selected_capabilities }}"
          echo "reason_summary=${{ steps.scope.outputs.reason_summary }}"
          echo "changed_path_count=${{ steps.scope.outputs.changed_path_count }}"
          echo "run_oasis7_required_tests=${{ steps.scope.outputs.run_oasis7_required_tests }}"
          echo "run_consensus_tests=${{ steps.scope.outputs.run_consensus_tests }}"
          echo "run_distfs_tests=${{ steps.scope.outputs.run_distfs_tests }}"
          echo "run_oasis7_node_tests=${{ steps.scope.outputs.run_oasis7_node_tests }}"
          echo "run_oasis7_net_tests=${{ steps.scope.outputs.run_oasis7_net_tests }}"
          echo "run_oasis7_net_libp2p_tests=${{ steps.scope.outputs.run_oasis7_net_libp2p_tests }}"
          echo "run_viewer_contract_tests=${{ steps.scope.outputs.run_viewer_contract_tests }}"
          echo "run_viewer_wasm_check=${{ steps.scope.outputs.run_viewer_wasm_check }}"
          echo "run_viewer_perf_smoke=${{ steps.scope.outputs.run_viewer_perf_smoke }}"
          echo "run_pixel_world_bridge_lib_tests=${{ steps.scope.outputs.run_pixel_world_bridge_lib_tests }}"
          echo "run_pixel_world_bridge_wasm_check=${{ steps.scope.outputs.run_pixel_world_bridge_wasm_check }}"
          echo "run_launcher_web_build=${{ steps.scope.outputs.run_launcher_web_build }}"
          echo "run_oasis7_workspace_support_crate_tests=${{ steps.scope.outputs.run_oasis7_workspace_support_crate_tests }}"
          echo "run_scenario_regression=${{ steps.scope.outputs.run_scenario_regression }}"
          echo "run_operational_contracts=${{ steps.scope.outputs.run_operational_contracts }}"
          echo "run_workflow_governance_contracts=${{ steps.scope.outputs.run_workflow_governance_contracts }}"
          echo "run_packaging_contracts=${{ steps.scope.outputs.run_packaging_contracts }}"
          echo "run_doc_checker_contracts=${{ steps.scope.outputs.run_doc_checker_contracts }}"
          echo "run_cargo_tooling_contracts=${{ steps.scope.outputs.run_cargo_tooling_contracts }}"
          echo "run_site_contract_tests=${{ steps.scope.outputs.run_site_contract_tests }}"
          echo "run_codex_agent_config_validation=${{ steps.scope.outputs.run_codex_agent_config_validation }}"
          echo "run_compile_metrics_contract_tests=${{ steps.scope.outputs.run_compile_metrics_contract_tests }}"
          echo "run_required_gate_baseline=${{ steps.scope.outputs.run_required_gate_baseline }}"
          echo "needs_node=${{ steps.scope.outputs.needs_node }}"
          echo "needs_python=${{ steps.scope.outputs.needs_python }}"
          echo "needs_markdown=${{ steps.scope.outputs.needs_markdown }}"
          echo "needs_system_deps=${{ steps.scope.outputs.needs_system_deps }}"
          echo "needs_trunk=${{ steps.scope.outputs.needs_trunk }}"
          echo "needs_wasm_target=${{ steps.scope.outputs.needs_wasm_target }}"
          echo "run_rust_baseline=${{ steps.scope.outputs.run_rust_baseline }}"
          echo "needs_rust_toolchain=${{ steps.scope.outputs.needs_rust_toolchain }}"
          echo "planner_config_sha256=${{ steps.scope.outputs.planner_config_sha256 }}"
      - name: Install pinned Markdown runtime for keyed inventory observation
        if: ${{ inputs.request_key != '' }}
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - id: keyed-plan
        name: Build attempt-scoped required-plan v2 from trusted W and M
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ toJSON(steps.scope.outputs) }}
          INTEGRATION_JSON: ${{ steps.integration.outputs.identity }}
          INTEGRATION_REQUEST_KEY: ${{ inputs.request_key }}
          INTEGRATION_REQUEST_B64: ${{ inputs.validation_request_b64 }}
          INTEGRATION_BASE: ${{ inputs.integration_base }}
          INTEGRATION_HEAD: ${{ inputs.expected_head }}
          INTEGRATION_UID: ${{ inputs.task_uid }}
          INTEGRATION_PR: ${{ inputs.pr_number }}
          INTEGRATION_WORKTREE: ${{ steps.integration.outputs.worktree }}
          TRUSTED_POLICY_JSON: ${{ runner.temp }}/trusted-ci-policy.json
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${INTEGRATION_REQUEST_KEY}" ]]; then
            echo 'unit_matrix=[]' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ -n "${INTEGRATION_WORKTREE:-}" ]] || {
            echo "keyed required-plan needs the exact W/M integration worktree" >&2
            exit 1
          }
          [[ -s "${TRUSTED_POLICY_JSON}" ]] || {
            echo "keyed required-plan needs trusted workflow policy context" >&2
            exit 1
          }
          python3 -I - <<'PY'
          import base64, importlib.util, json, os, pathlib, sys
          workspace=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          scripts=workspace/"scripts"
          sys.path.insert(0,str(scripts/"pm"))
          sys.path.insert(0,str(scripts))
          import ci_required_inventory as inventory_module
          import ci_required_artifact_v2 as artifact_module
          import integration_ci as integration_module
          import integration_executor_contract as request_contract

          plan_output=json.loads(os.environ["PLAN_JSON"])
          integration=json.loads(os.environ["INTEGRATION_JSON"])
          if not isinstance(integration,dict) or not integration.get("integration_worktree"):
              raise SystemExit("exact keyed M worktree identity is unavailable")
          policy=json.loads(pathlib.Path(os.environ["TRUSTED_POLICY_JSON"]).read_text(encoding="utf-8"))
          try:
              request_raw=base64.b64decode(os.environ["INTEGRATION_REQUEST_B64"],validate=True)
              request_envelope=json.loads(request_raw.decode("utf-8"))
          except (ValueError,UnicodeDecodeError,json.JSONDecodeError) as exc:
              raise SystemExit("canonical validation request cannot be decoded") from exc
          request=request_contract.validation_request_envelope(request_envelope)
          if request_raw!=request_contract.canonical_bytes(request):
              raise SystemExit("validation request envelope is noncanonical")
          if request["request_key"]!=os.environ["INTEGRATION_REQUEST_KEY"]:
              raise SystemExit("validation request key differs from workflow input")
          run_id=int(os.environ["GITHUB_RUN_ID"])
          attempt=int(os.environ["GITHUB_RUN_ATTEMPT"])
          app_id=policy["effective_policy"]["check_app_id"]
          gate_jobs=integration_module.attempt_execution_jobs(
              os.environ["GITHUB_REPOSITORY"],run_id,attempt,
              os.environ["GITHUB_WORKFLOW_SHA"],app_id,job_names={"required-gate"},
          )
          if len(gate_jobs)!=1:
              raise SystemExit("exact in-progress required-gate check is unavailable")
          changed_raw=plan_output.get("changed_paths","")
          changed_paths=changed_raw.split(";") if changed_raw else []
          inventory=inventory_module.build_required_inventory(
              workspace,pathlib.Path(integration["integration_worktree"]),
              integration["tested_commit_oid"],plan_output,
              repository=os.environ["GITHUB_REPOSITORY"],
              workflow_ref=os.environ["GITHUB_WORKFLOW_REF"],
              planner_authority_oid=os.environ["GITHUB_WORKFLOW_SHA"],
              event_name="workflow_dispatch",run_mode="integration_revalidation",
              changed_paths=changed_paths,base_ref=os.environ["INTEGRATION_BASE"],
              head_ref=os.environ["INTEGRATION_HEAD"],task_uid=os.environ["INTEGRATION_UID"],
              scope_base_oid=plan_output["source_scope_base"],
              impact_projection=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"impact-projection.json"),
              run_id=run_id,run_attempt=attempt,check_app_id=app_id,
              check_run_id=gate_jobs[0]["check_run_id"],
          )
          payload=artifact_module.assemble_plan_payload(
              inventory,request_identity=request["identity"],request_key=request["request_key"],
              trusted_policy_context=policy,gate_job=gate_jobs[0],
              workflow_ref=os.environ["GITHUB_WORKFLOW_REF"],
              workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
              workflow_run_id=run_id,run_attempt=attempt,
          )
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/artifact_module.PLAN_V2_MEMBER
          output.write_bytes(artifact_module.canonical_bytes(payload)+b"\n")
          artifact_name=artifact_module.plan_artifact_name(run_id,attempt)
          unit_matrix=[{"unit_id":unit,"artifact_name":artifact_module.result_artifact_name(run_id,attempt,unit)}
                       for unit in payload["required_test_units"]]
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a",encoding="utf-8") as stream:
              stream.write("plan_artifact_name="+artifact_name+"\n")
              stream.write("unit_matrix="+json.dumps(unit_matrix,sort_keys=True,separators=(",",":"))+"\n")
          PY
      - name: Write required planner artifact
        env:
          PLAN_JSON: ${{ toJSON(steps.scope.outputs) }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          INTEGRATION_JSON: ${{ steps.integration.outputs.identity }}
        run: |
          mkdir -p output/required-plan
          python3 -I - <<'PY'
          import json, os, pathlib
          source=json.loads(os.environ["PLAN_JSON"])
          legacy_fields=(
              "scope", "selected_capabilities", "reason_summary", "changed_path_count",
              "source_scope_base", "integration_base", "source_head",
              "run_oasis7_required_tests", "run_consensus_tests", "run_distfs_tests",
              "run_oasis7_node_tests", "run_oasis7_net_tests", "run_oasis7_net_libp2p_tests",
              "run_viewer_contract_tests", "run_viewer_wasm_check", "run_viewer_perf_smoke",
              "run_pixel_world_bridge_lib_tests", "run_pixel_world_bridge_wasm_check",
              "run_launcher_web_build", "run_oasis7_workspace_support_crate_tests",
              "run_scenario_regression", "run_operational_contracts", "run_site_contract_tests", "run_codex_agent_config_validation", "run_compile_metrics_contract_tests", "run_required_gate_baseline",
              "run_rust_baseline", "needs_rust_toolchain", "planner_config_sha256",
          )
          execution_contract=source.get("execution_contract", "")
          if execution_contract == "required-domain-split/v1":
              split_fields=(
                  "execution_contract", "run_workflow_governance_contracts", "run_packaging_contracts",
                  "run_doc_checker_contracts", "run_cargo_tooling_contracts",
                  "needs_python", "needs_markdown", "needs_node", "needs_system_deps", "needs_trunk", "needs_wasm_target",
              )
              fields=legacy_fields + split_fields
              selector_fields=(
                  "run_oasis7_required_tests", "run_consensus_tests", "run_distfs_tests",
                  "run_oasis7_node_tests", "run_oasis7_net_tests", "run_oasis7_net_libp2p_tests",
                  "run_viewer_contract_tests", "run_viewer_wasm_check", "run_viewer_perf_smoke",
                  "run_pixel_world_bridge_lib_tests", "run_pixel_world_bridge_wasm_check",
                  "run_launcher_web_build", "run_oasis7_workspace_support_crate_tests",
                  "run_scenario_regression", "run_operational_contracts", "run_site_contract_tests",
                  "run_codex_agent_config_validation", "run_compile_metrics_contract_tests", "run_rust_baseline",
                  "run_workflow_governance_contracts", "run_packaging_contracts",
                  "run_doc_checker_contracts", "run_cargo_tooling_contracts",
              )
              resource_fields=(
                  "needs_python", "needs_markdown", "needs_rust_toolchain", "needs_node",
                  "needs_system_deps", "needs_trunk", "needs_wasm_target",
              )
          elif execution_contract == "":
              new_fields=(
                  "run_workflow_governance_contracts", "run_packaging_contracts",
                  "run_doc_checker_contracts", "run_cargo_tooling_contracts", "needs_python", "needs_markdown",
              )
              mixed=[field for field in new_fields if source.get(field) not in (None, "")]
              if mixed:
                  raise SystemExit(f"unversioned planner contains versioned fields: {', '.join(mixed)}")
              fields=legacy_fields
          else:
              raise SystemExit(f"unsupported required-gate execution contract: {execution_contract}")
          missing=[field for field in fields if field not in source]
          if missing:
              raise SystemExit(f"missing required planner outputs: {', '.join(missing)}")
          if execution_contract == "required-domain-split/v1":
              for field in selector_fields + resource_fields:
                  if source[field] not in ("true", "false"):
                      raise SystemExit(f"{field} must be explicitly true or false for {execution_contract}")
              if source["needs_python"] != "true" or source["needs_markdown"] != "true":
                  raise SystemExit("required-gate baseline document checks require planned Python and Markdown resources")
          if execution_contract == "required-domain-split/v1":
              if source["run_cargo_tooling_contracts"] == "true" and source["needs_rust_toolchain"] != "true":
                  raise SystemExit("Cargo tooling contracts require the planned Rust toolchain resource")
              selector_resources={
                  "run_oasis7_required_tests": ("needs_rust_toolchain", "needs_system_deps"),
                  "run_consensus_tests": ("needs_rust_toolchain",),
                  "run_distfs_tests": ("needs_rust_toolchain",),
                  "run_oasis7_node_tests": ("needs_rust_toolchain",),
                  "run_oasis7_net_tests": ("needs_rust_toolchain",),
                  "run_oasis7_net_libp2p_tests": ("needs_rust_toolchain",),
                  "run_viewer_contract_tests": ("needs_rust_toolchain", "needs_node", "needs_system_deps", "needs_wasm_target"),
                  "run_viewer_wasm_check": ("needs_rust_toolchain", "needs_node", "needs_system_deps", "needs_wasm_target"),
                  "run_viewer_perf_smoke": ("needs_node", "needs_system_deps"),
                  "run_pixel_world_bridge_lib_tests": ("needs_rust_toolchain", "needs_system_deps", "needs_wasm_target"),
                  "run_pixel_world_bridge_wasm_check": ("needs_rust_toolchain", "needs_system_deps", "needs_wasm_target"),
                  "run_launcher_web_build": ("needs_rust_toolchain", "needs_node", "needs_system_deps", "needs_wasm_target", "needs_trunk"),
                  "run_oasis7_workspace_support_crate_tests": ("needs_rust_toolchain", "needs_system_deps"),
                  "run_scenario_regression": ("needs_rust_toolchain",),
                  "run_operational_contracts": (),
                  "run_workflow_governance_contracts": (),
                  "run_packaging_contracts": (),
                  "run_doc_checker_contracts": ("needs_python", "needs_markdown"),
                  "run_cargo_tooling_contracts": ("needs_rust_toolchain",),
                  "run_site_contract_tests": (),
                  "run_codex_agent_config_validation": (),
                  "run_compile_metrics_contract_tests": (),
                  "run_rust_baseline": ("needs_rust_toolchain",),
              }
              for selector, required_resources in selector_resources.items():
                  if source[selector] != "true":
                      continue
                  missing_resources=[name for name in required_resources if source[name] != "true"]
                  if missing_resources:
                      raise SystemExit(f"{selector} requires planned resources: {', '.join(missing_resources)}")
              for derived, source_field in (
                  ("run_oasis7_net_libp2p_tests", "run_oasis7_net_tests"),
                  ("run_viewer_wasm_check", "run_viewer_contract_tests"),
                  ("run_pixel_world_bridge_wasm_check", "run_pixel_world_bridge_lib_tests"),
                  ("run_rust_baseline", "needs_rust_toolchain"),
              ):
                  if source[derived] != source[source_field]:
                      raise SystemExit(f"{derived} must match planner-derived {source_field}")
          planner={field:source[field] for field in fields}
          if source.get("impact_projection_status") == "verified":
              projection_fields=("impact_projection_schema", "impact_projection_digest",
                                 "impact_projection_status", "test_profile", "declared_tests",
                                 "planner_digest")
              missing_projection=[field for field in projection_fields if not source.get(field)]
              if missing_projection:
                  raise SystemExit(f"missing impact projection outputs: {', '.join(missing_projection)}")
              planner.update({field:source[field] for field in projection_fields})
          payload={
              "schema":"oasis7-required-plan-v1",
              "repository":os.environ["REPOSITORY"],
              "workflow_run_id":int(os.environ["WORKFLOW_RUN_ID"]),
              "head_oid":source["head_oid"],
              "base_oid":source["base_oid"],
              "integration_base_oid":source["integration_base_oid"],
              "check_name":"required-gate",
              "planner":planner,
          }
          if os.environ.get("INTEGRATION_JSON"):
              payload.update(json.loads(os.environ["INTEGRATION_JSON"]))
          pathlib.Path("output/required-plan/oasis7-required-plan-v1.json").write_text(
              json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8"
          )
          PY
      - id: upload-plan-v2
        name: Upload exact-attempt required plan v2
        if: ${{ inputs.request_key != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.keyed-plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/oasis7-required-plan-v2.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Upload required planner artifact
        uses: actions/upload-artifact@v7
        with:
          name: oasis7-required-plan-v1
          path: output/required-plan/oasis7-required-plan-v1.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Install pinned Rust toolchains
        if: ${{ steps.scope.outputs.needs_rust_toolchain == 'true' }}
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          if [[ "${{ steps.scope.outputs.needs_wasm_target }}" == "true" ]]; then
            rustup target add wasm32-unknown-unknown --toolchain "${RUST_TOOLCHAIN}"
          fi
      - name: Install cargo-deny
        if: ${{ steps.scope.outputs.needs_rust_toolchain == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - uses: actions/setup-node@v6
        if: ${{ steps.scope.outputs.needs_node == 'true' }}
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        if: ${{ steps.scope.outputs.needs_node == 'true' }}
        env:
          INTEGRATION_WORKTREE: ${{ steps.integration.outputs.worktree }}
        run: npm ci --prefix "${INTEGRATION_WORKTREE:-${GITHUB_WORKSPACE}}/crates/oasis7_viewer"
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.scope.outputs.run_oasis7_required_tests == 'true' || steps.scope.outputs.run_consensus_tests == 'true' || steps.scope.outputs.run_distfs_tests == 'true' || steps.scope.outputs.run_oasis7_node_tests == 'true' || steps.scope.outputs.run_oasis7_net_tests == 'true' || steps.scope.outputs.run_oasis7_net_libp2p_tests == 'true' || steps.scope.outputs.run_viewer_wasm_check == 'true' || steps.scope.outputs.run_viewer_contract_tests == 'true' || steps.scope.outputs.run_launcher_web_build == 'true' || steps.scope.outputs.run_oasis7_workspace_support_crate_tests == 'true' || steps.scope.outputs.run_cargo_tooling_contracts == 'true' }}
        with:
          shared-key: ci-required-gate-v1
      - name: Install trunk
        if: ${{ steps.scope.outputs.needs_trunk == 'true' }}
        run: cargo install trunk --locked
      - name: Install system deps
        if: >-
          ${{ steps.scope.outputs.needs_system_deps == 'true' ||
              (steps.scope.outputs.execution_contract != 'required-domain-split/v1' &&
               (steps.scope.outputs.run_oasis7_required_tests == 'true' ||
                steps.scope.outputs.run_viewer_contract_tests == 'true' ||
                steps.scope.outputs.run_viewer_wasm_check == 'true' ||
                steps.scope.outputs.run_viewer_perf_smoke == 'true' ||
                steps.scope.outputs.run_launcher_web_build == 'true' ||
                steps.scope.outputs.run_oasis7_workspace_support_crate_tests == 'true')) }}
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          max_attempts=3
          run_apt() {
            local operation="$1"
            shift
            local attempt
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              echo "apt ${operation} attempt ${attempt}/${max_attempts}"
              if sudo timeout --foreground 120s apt-get "${apt_options[@]}" "$@"; then
                return 0
              fi
              if (( attempt < max_attempts )); then
                echo "warning: apt ${operation} failed; retrying" >&2
                sleep 5
              fi
            done
            echo "error: apt ${operation} failed after ${max_attempts} attempts" >&2
            return 1
          }
          run_apt update update
          run_apt install install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Run required test tier
        id: required-gate-tests
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_MODE: ${{ inputs.run_mode }}
          INTEGRATION_WORKTREE: ${{ steps.integration.outputs.worktree }}
          OASIS7_CI_EXECUTION_CONTRACT: ${{ steps.scope.outputs.execution_contract }}
          OASIS7_PRODUCT_DOC_BASE: ${{ steps.scope.outputs.source_scope_base }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ steps.scope.outputs.head_oid }}
          OASIS7_CI_RUN_OASIS7_REQUIRED_TESTS: ${{ steps.scope.outputs.run_oasis7_required_tests }}
          OASIS7_CI_RUN_CONSENSUS_TESTS: ${{ steps.scope.outputs.run_consensus_tests }}
          OASIS7_CI_RUN_DISTFS_TESTS: ${{ steps.scope.outputs.run_distfs_tests }}
          OASIS7_CI_RUN_OASIS7_NODE_TESTS: ${{ steps.scope.outputs.run_oasis7_node_tests }}
          OASIS7_CI_RUN_OASIS7_NET_TESTS: ${{ steps.scope.outputs.run_oasis7_net_tests }}
          OASIS7_CI_RUN_OASIS7_NET_LIBP2P_TESTS: ${{ steps.scope.outputs.run_oasis7_net_libp2p_tests }}
          OASIS7_CI_RUN_VIEWER_CONTRACT_TESTS: ${{ steps.scope.outputs.run_viewer_contract_tests }}
          OASIS7_CI_RUN_VIEWER_WASM_CHECK: ${{ steps.scope.outputs.run_viewer_wasm_check }}
          OASIS7_CI_RUN_VIEWER_PERF_SMOKE: ${{ steps.scope.outputs.run_viewer_perf_smoke }}
          OASIS7_CI_RUN_PIXEL_WORLD_BRIDGE_LIB_TESTS: ${{ steps.scope.outputs.run_pixel_world_bridge_lib_tests }}
          OASIS7_CI_RUN_PIXEL_WORLD_BRIDGE_WASM_CHECK: ${{ steps.scope.outputs.run_pixel_world_bridge_wasm_check }}
          OASIS7_CI_RUN_LAUNCHER_WEB_BUILD: ${{ steps.scope.outputs.run_launcher_web_build }}
          OASIS7_CI_RUN_WORKSPACE_SUPPORT_CRATE_TESTS: ${{ steps.scope.outputs.run_oasis7_workspace_support_crate_tests }}
          OASIS7_CI_RUN_SCENARIO_REGRESSION: ${{ steps.scope.outputs.run_scenario_regression }}
          OASIS7_CI_RUN_OPERATIONAL_CONTRACTS: ${{ steps.scope.outputs.run_operational_contracts }}
          OASIS7_CI_RUN_WORKFLOW_GOVERNANCE_CONTRACTS: ${{ steps.scope.outputs.run_workflow_governance_contracts }}
          OASIS7_CI_RUN_PACKAGING_CONTRACTS: ${{ steps.scope.outputs.run_packaging_contracts }}
          OASIS7_CI_RUN_DOC_CHECKER_CONTRACTS: ${{ steps.scope.outputs.run_doc_checker_contracts }}
          OASIS7_CI_RUN_CARGO_TOOLING_CONTRACTS: ${{ steps.scope.outputs.run_cargo_tooling_contracts }}
          OASIS7_CI_RUN_SITE_CONTRACT_TESTS: ${{ steps.scope.outputs.run_site_contract_tests }}
          OASIS7_CI_RUN_CODEX_AGENT_CONFIG_VALIDATION: ${{ steps.scope.outputs.run_codex_agent_config_validation }}
          OASIS7_CI_RUN_COMPILE_METRICS_CONTRACT_TESTS: ${{ steps.scope.outputs.run_compile_metrics_contract_tests }}
          OASIS7_CI_RUN_RUST_BASELINE: ${{ steps.scope.outputs.run_rust_baseline }}
          OASIS7_CI_NEEDS_PYTHON: ${{ steps.scope.outputs.needs_python }}
          OASIS7_CI_NEEDS_MARKDOWN: ${{ steps.scope.outputs.needs_markdown }}
          OASIS7_CI_NEEDS_RUST_TOOLCHAIN: ${{ steps.scope.outputs.needs_rust_toolchain }}
          OASIS7_CI_NEEDS_NODE: ${{ steps.scope.outputs.needs_node }}
          OASIS7_CI_NEEDS_SYSTEM_DEPS: ${{ steps.scope.outputs.needs_system_deps }}
          OASIS7_CI_NEEDS_TRUNK: ${{ steps.scope.outputs.needs_trunk }}
          OASIS7_CI_NEEDS_WASM_TARGET: ${{ steps.scope.outputs.needs_wasm_target }}
          OASIS7_CI_RUN_HOSTED_ACCOUNT_SMOKE: "false"
          OASIS7_CI_RUN_PROVIDER_LIVE_GATE: "false"
          OASIS7_CARGO_SCOPE_BASE: ${{ steps.scope.outputs.source_scope_base }}
          OASIS7_CARGO_SCOPE_HEAD: ${{ steps.scope.outputs.head_oid }}
          OASIS7_CARGO_SCOPE_INTEGRATION_BASE: ${{ steps.scope.outputs.integration_base_oid }}
          OASIS7_CARGO_STAGE_CHECK_HEAD: ${{ steps.scope.outputs.head_oid }}
          OASIS7_CARGO_STAGE_PR_NUMBER: ${{ steps.checker-stage.outputs.pr_number }}
          OASIS7_CARGO_STAGE_TASK_UID: ${{ steps.checker-stage.outputs.task_uid }}
        run: |
          trusted_checker="${RUNNER_TEMP}/trusted-check-cargo-package-scope"
          trusted_profile_authority="${RUNNER_TEMP}/trusted-cargo-profile-authority"
          trusted_profile_planner="${trusted_profile_authority}/cargo_package_profile_planner.py"
          trusted_profile_driver="${trusted_profile_authority}/cargo_package_profile_driver.py"
          if [[ -n "${OASIS7_CARGO_SCOPE_BASE:-}" ]] && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git show "${OASIS7_CARGO_SCOPE_BASE}:scripts/pm/check-cargo-package-scope" >"${trusted_checker}"
            chmod +x "${trusted_checker}"
            export OASIS7_CARGO_SCOPE_CHECKER="${trusted_checker}"
            mkdir -p "${trusted_profile_authority}/pm"
            if git show "${OASIS7_CARGO_SCOPE_BASE}:scripts/pm/workflow-impact-projection.py" >"${trusted_profile_authority}/pm/workflow-impact-projection.py" 2>/dev/null &&
               git show "${OASIS7_CARGO_SCOPE_BASE}:scripts/pm/cargo_package_profile_planner.py" >"${trusted_profile_planner}" 2>/dev/null &&
               git show "${OASIS7_CARGO_SCOPE_BASE}:scripts/pm/cargo_package_profile_driver.py" >"${trusted_profile_driver}" 2>/dev/null; then
              export OASIS7_CARGO_PROFILE_PLANNER="${trusted_profile_planner}"
              export OASIS7_CARGO_PROFILE_DRIVER="${trusted_profile_driver}"
              export OASIS7_CARGO_PROFILE_INTEGRATION_BASE="${{ steps.scope.outputs.integration_base_oid }}"
              export OASIS7_CARGO_PROFILE_SOURCE_HEAD="${OASIS7_CARGO_SCOPE_HEAD}"
            fi
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INTEGRATION_MODE}" == "integration_revalidation" ]]; then
            if [[ -n "${OASIS7_CARGO_STAGE_PR_NUMBER:-}" ]]; then
              echo "trusted checker-stage integration route: generic Cargo profile planner is bypassed"
            elif [[ -n "${OASIS7_CARGO_SCOPE_BASE:-}" ]]; then
              [[ -n "${OASIS7_CARGO_PROFILE_PLANNER:-}" && -n "${OASIS7_CARGO_PROFILE_DRIVER:-}" ]] || {
                echo "trusted Cargo package profile authority is unavailable" >&2
                exit 1
              }
            profile_output="${GITHUB_WORKSPACE}/output/cargo-package-profile"
            mkdir -p "${profile_output}"
            export OASIS7_CARGO_PROFILE_OPT_IN=true
            export OASIS7_CARGO_PROFILE_PLAN="${profile_output}/cargo-package-profile-plan.json"
            export OASIS7_CARGO_PROFILE_RESULTS="${profile_output}/cargo-package-profile-results.json"
            python3 "${OASIS7_CARGO_PROFILE_PLANNER}" \
              --repo-root "${INTEGRATION_WORKTREE:-${GITHUB_WORKSPACE}}" \
              --integration-base "${OASIS7_CARGO_PROFILE_INTEGRATION_BASE}" \
              --source-head "${OASIS7_CARGO_PROFILE_SOURCE_HEAD}" \
              --policy .pm/cargo-package-scope-policy.json \
              --checker scripts/pm/check-cargo-package-scope \
              --profile native --output "${OASIS7_CARGO_PROFILE_PLAN}"
            OASIS7_CARGO_PROFILE_TESTED_TREE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tested_tree"])' "${OASIS7_CARGO_PROFILE_PLAN}")"
            export OASIS7_CARGO_PROFILE_TESTED_TREE
            # Receipt identity order: integration_base, source_head, tested_tree.
            python3 -I - "${OASIS7_CARGO_PROFILE_PLAN}" "${OASIS7_CARGO_PROFILE_RESULTS}" <<'PY'
          import json, os, pathlib, subprocess, sys
          plan_path, results_path = map(pathlib.Path, sys.argv[1:])
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          results = []
          for item in plan["items"]:
              command = item.get("command")
              if not isinstance(command, list) or not command or command[0] != "cargo" or any(not isinstance(value, str) for value in command):
                  raise SystemExit("trusted planner emitted an invalid command argv")
              environment = dict(os.environ)
              environment.pop("RUSTC_WRAPPER", None)
              # Contract: doc/engineering/workflow/source-of-truth.md#required-gate-native-wasm-smoke.
              # The planner's target selector is "native" for every host-native profile item.
              if item["target"] == "native":
                  environment["OASIS7_WASM_BUILD_STD"] = "0"
              completed = subprocess.run(command, env=environment, check=False)
              results.append({
                  "item_id": item["id"], "status": "passed" if completed.returncode == 0 else "failed",
                  "exit_code": completed.returncode, "plan_id": plan["plan_id"],
                  "command_digest": item["command_digest"],
                  "toolchain": plan["trusted_authority"]["toolchain"],
                  "profile": {field: item[field] for field in ("package", "profile", "target", "features")},
                  "integration_base": plan["integration_base"], "source_head": plan["source_head"],
                  "tested_tree": plan["tested_tree"],
              })
              if completed.returncode != 0:
                  break
          results_path.write_text(json.dumps(results, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            python3 "${OASIS7_CARGO_PROFILE_DRIVER}" \
              --plan "${OASIS7_CARGO_PROFILE_PLAN}" --results "${OASIS7_CARGO_PROFILE_RESULTS}" \
              --integration-base "${OASIS7_CARGO_PROFILE_INTEGRATION_BASE}" \
              --source-head "${OASIS7_CARGO_PROFILE_SOURCE_HEAD}" \
              --tested-tree "${OASIS7_CARGO_PROFILE_TESTED_TREE}" \
              >"${profile_output}/cargo-package-profile-receipt.json"
            GH_TOKEN="${{ github.token }}" python3 -I - "${OASIS7_CARGO_PROFILE_PLAN}" "${OASIS7_CARGO_PROFILE_RESULTS}" \
              "${profile_output}/cargo-package-profile-receipt.json" \
              "${profile_output}/cargo-package-profile-envelope.json" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          plan_path, results_path, receipt_path, envelope_path = map(pathlib.Path, sys.argv[1:])
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          checks = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/check-runs?per_page=100"
          ], text=True)).get("check_runs", [])
          matches = [check for check in checks
                     if check.get("name") == "required-gate"
                     and f"/actions/runs/{os.environ['GITHUB_RUN_ID']}" in str(check.get("details_url") or "")]
          if len(matches) != 1:
              raise SystemExit("exact required-gate check run identity is unavailable")
          check = matches[0]
          digest = lambda path: "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          envelope = {
              "schema": "oasis7-cargo-package-profile-envelope/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "task_uid": "${{ inputs.task_uid }}", "pr_number": int("${{ inputs.pr_number }}"),
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "check_name": "required-gate", "check_app_id": int(check["app"]["id"]),
              "check_run_id": int(check["id"]),
              "integration_base": plan["integration_base"], "source_head": plan["source_head"],
              "tested_tree": plan["tested_tree"], "plan_digest": digest(plan_path),
              "results_digest": digest(results_path), "receipt_digest": digest(receipt_path),
          }
          envelope_path.write_text(json.dumps(envelope, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            fi
            target_root="${INTEGRATION_WORKTREE:-${GITHUB_WORKSPACE}}"
            CI_VERBOSE=1 bash "${RUNNER_TEMP}/integration-planner/ci-tests.sh" required --repo-root "${target_root}" --impact-projection "${RUNNER_TEMP}/impact-projection.json"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -f "${RUNNER_TEMP}/impact-projection.json" ]]; then
            CI_VERBOSE=1 ./scripts/ci-tests.sh required --impact-projection "${RUNNER_TEMP}/impact-projection.json"
          else
            CI_VERBOSE=1 ./scripts/ci-tests.sh required
          fi
      - name: Upload Cargo package profile plan
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation' && steps.checker-stage.outputs.pr_number == ''
        uses: actions/upload-artifact@v7
        with:
          name: cargo-package-profile-plan
          path: output/cargo-package-profile/cargo-package-profile-plan.json
          if-no-files-found: error
      - name: Upload Cargo package profile results
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation' && steps.checker-stage.outputs.pr_number == ''
        uses: actions/upload-artifact@v7
        with:
          name: cargo-package-profile-results
          path: output/cargo-package-profile/cargo-package-profile-results.json
          if-no-files-found: error
      - name: Upload Cargo package profile receipt
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation' && steps.checker-stage.outputs.pr_number == ''
        uses: actions/upload-artifact@v7
        with:
          name: cargo-package-profile-receipt
          path: output/cargo-package-profile/cargo-package-profile-receipt.json
          if-no-files-found: error
      - name: Upload Cargo package profile envelope
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation' && steps.checker-stage.outputs.pr_number == ''
        uses: actions/upload-artifact@v7
        with:
          name: cargo-package-profile-envelope
          path: output/cargo-package-profile/cargo-package-profile-envelope.json
          if-no-files-found: error
      - name: Upload selected Viewer performance evidence
        if: ${{ always() && steps.scope.outputs.run_viewer_perf_smoke == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: viewer-performance-required-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/viewer-performance/**
          if-no-files-found: error
          retention-days: 7
      - name: Run execution bridge binary unit suite
        if: ${{ steps.scope.outputs.run_oasis7_required_tests == 'true' }}
        env:
          INTEGRATION_WORKTREE: ${{ steps.integration.outputs.worktree }}
        run: |
          set -euo pipefail
          if [[ -n "${INTEGRATION_WORKTREE}" ]]; then cd "${INTEGRATION_WORKTREE}"; fi
          env -u RUSTC_WRAPPER cargo test -p oasis7 --bin oasis7_chain_runtime \
            --features test_tier_required \
            execution_bridge_real_tests::real_execution_bridge::tests

  checker-stage-receipt:
    needs: required-gate
    if: ${{ needs.required-gate.result == 'success' && needs.required-gate.outputs.checker_stage_pr_number != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.required-gate.outputs.checker_stage_integration_base_oid }}
          fetch-depth: 0
      - name: Fetch and verify the selected checker PR head
        env:
          CHECKER_PR_NUMBER: ${{ needs.required-gate.outputs.checker_stage_pr_number }}
          CHECKER_INTEGRATION_BASE: ${{ needs.required-gate.outputs.checker_stage_integration_base_oid }}
          CHECKER_SOURCE_HEAD: ${{ needs.required-gate.outputs.checker_stage_head_oid }}
          CHECKER_SOURCE_SCOPE: ${{ needs.required-gate.outputs.checker_stage_source_scope_oid }}
        shell: bash
        run: |
          set -euo pipefail
          checked_out_base="$(git rev-parse "HEAD^{commit}")"
          [[ "${checked_out_base}" == "${CHECKER_INTEGRATION_BASE}" ]] || {
            echo "fresh producer checkout differs from required-gate integration base" >&2
            exit 1
          }
          source_ref="refs/remotes/origin/checker-stage-${CHECKER_PR_NUMBER}"
          git fetch --no-tags origin "refs/pull/${CHECKER_PR_NUMBER}/head:${source_ref}"
          fetched_head="$(git rev-parse "${source_ref}^{commit}")"
          [[ "${fetched_head}" == "${CHECKER_SOURCE_HEAD}" ]] || {
            echo "fetched checker PR head differs from required-gate readback" >&2
            exit 1
          }
          git cat-file -e "${CHECKER_SOURCE_SCOPE}^{commit}"
      - id: checker-stage-producer
        name: Produce trusted checker-stage admission receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          CHECKER_PR_NUMBER: ${{ needs.required-gate.outputs.checker_stage_pr_number }}
          CHECKER_TASK_UID: ${{ needs.required-gate.outputs.checker_stage_task_uid }}
          CHECKER_INTEGRATION_BASE: ${{ needs.required-gate.outputs.checker_stage_integration_base_oid }}
          CHECKER_SOURCE_HEAD: ${{ needs.required-gate.outputs.checker_stage_head_oid }}
          CHECKER_SOURCE_SCOPE: ${{ needs.required-gate.outputs.checker_stage_source_scope_oid }}
          CHECKER_REPO_ROOT: ${{ github.workspace }}
          OASIS7_CARGO_STAGE_CHECK_HEAD: ${{ needs.required-gate.outputs.checker_stage_head_oid }}
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d "${RUNNER_TEMP}/checker-stage-produce.XXXXXX")"
          trusted_adapter="${stage_dir}/cargo_checker_stage_admission.py"
          trusted_planner="${stage_dir}/cargo_package_profile_planner.py"
          trusted_checker="${stage_dir}/trusted-check-cargo-package-scope"
          trusted_policy="${stage_dir}/cargo-package-scope-policy.json"
          preflight="${stage_dir}/preflight.json"
          receipt="${stage_dir}/post-run-receipt.json"
          git show "${CHECKER_SOURCE_SCOPE}:scripts/pm/cargo_checker_stage_admission.py" >"${trusted_adapter}"
          git show "${CHECKER_SOURCE_SCOPE}:scripts/pm/cargo_package_profile_planner.py" >"${trusted_planner}"
          git show "${CHECKER_SOURCE_SCOPE}:scripts/pm/check-cargo-package-scope" >"${trusted_checker}"
          git show "${CHECKER_SOURCE_SCOPE}:.pm/cargo-package-scope-policy.json" >"${trusted_policy}"
          chmod +x "${trusted_adapter}" "${trusted_checker}"
          common=(--repository "${GITHUB_REPOSITORY}" --pr-number "${CHECKER_PR_NUMBER}"
            --repo-root "${CHECKER_REPO_ROOT}" --base "${CHECKER_INTEGRATION_BASE}"
            --head "${CHECKER_SOURCE_HEAD}" --scope-base "${CHECKER_SOURCE_SCOPE}"
            --planner-path "${trusted_planner}" --checker-path "${trusted_checker}"
            --policy-path "${trusted_policy}" --primary-package auto --task-uid "${CHECKER_TASK_UID}"
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --check-head "${GITHUB_SHA}" --check-name required-gate
            --workflow-ref "${GITHUB_WORKFLOW_REF}" --workflow-sha "${GITHUB_WORKFLOW_SHA}")
          python3 -I "${trusted_adapter}" preflight "${common[@]}" --output "${preflight}"
          python3 -I - "${preflight}" <<'PY'
          import json, pathlib, subprocess, sys
          preflight = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          result = subprocess.run(preflight["checker_command"], check=False)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PY
          preflight_digest="$(python3 -I - "${preflight}" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["preflight_digest"])
          PY
          )"
          python3 -I "${trusted_adapter}" post-run "${common[@]}" \
            --producer-job-name "${GITHUB_JOB}" \
            --preflight "${preflight}" --preflight-digest "${preflight_digest}" \
            --result-status passed --exit-code 0 --output "${receipt}"
          echo "receipt=${receipt}" >>"${GITHUB_OUTPUT}"
      - name: Upload Cargo checker-stage admission receipt
        if: ${{ always() && steps.checker-stage-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-checker-stage-admission-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.checker-stage-producer.outputs.receipt }}
          if-no-files-found: error
          retention-days: 7

  v1-reuse-validation-only:
    name: v1-reuse-validation-only
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.run_mode == 'v1_reuse_validation_only' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.3'
      - name: Install trusted Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-required-gate-v1
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - name: Install pinned Trunk
        run: cargo install trunk --locked --version "${TRUNK_VERSION}"
      - name: Verify pinned Trunk
        shell: bash
        run: trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - id: validation
        name: Verify authority and execute validation-only units on exact M
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 -I scripts/pm/ci-reuse-validation.py
      - name: Upload isolated validation-only payload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.validation.outputs.artifact_name }}
          path: output/ci-reuse-validation/oasis7-ci-reuse-validation.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  windows-package-rollout-behavior:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    needs: required-gate
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation')) && needs.required-gate.outputs.run_operational_contracts == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: integration
        name: Prepare exact manual integration from trusted default workflow
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation'
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_BASE: ${{ inputs.integration_base }}
          INTEGRATION_HEAD: ${{ inputs.expected_head }}
          INTEGRATION_UID: ${{ inputs.task_uid }}
          INTEGRATION_PR: ${{ inputs.pr_number }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INTEGRATION_REQUEST_KEY: ${{ inputs.request_key }}
          INTEGRATION_REQUEST_B64: ${{ inputs.validation_request_b64 }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/integration-planner"
          cp scripts/plan-rust-required-scope.py scripts/ci-required-scope.v2.json scripts/ci-tests.sh "${RUNNER_TEMP}/integration-planner/"
          cp scripts/pm/integration_ci.py "${RUNNER_TEMP}/integration_ci.py"
          prepare_args=(prepare --repository "${{ github.repository }}" \
            --task-uid "${INTEGRATION_UID}" --pr-number "${INTEGRATION_PR}" \
            --base "${INTEGRATION_BASE}" --head "${INTEGRATION_HEAD}" --output "${RUNNER_TEMP}/integration.json")
          if [[ -n "${INTEGRATION_REQUEST_KEY}" || -n "${INTEGRATION_REQUEST_B64}" ]]; then
            [[ -n "${INTEGRATION_REQUEST_KEY}" && -n "${INTEGRATION_REQUEST_B64}" ]] || exit 1
            cp scripts/pm/integration_executor_contract.py scripts/pm/ci_ready_receipt_identity.py "${RUNNER_TEMP}/"
            python3 -I scripts/pm/ci_reuse_policy.py trusted-context --root "${GITHUB_WORKSPACE}" \
              --repository "${GITHUB_REPOSITORY}" --default-branch "${GITHUB_DEFAULT_BRANCH}" \
              --workflow-ref "${GITHUB_WORKFLOW_REF}" --workflow-sha "${GITHUB_WORKFLOW_SHA}" \
              --default-branch-sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/trusted-ci-policy.json"
            prepare_args+=(--request-key "${INTEGRATION_REQUEST_KEY}" \
              --validation-request-b64 "${INTEGRATION_REQUEST_B64}" \
              --trusted-policy-json "${RUNNER_TEMP}/trusted-ci-policy.json" \
              --integration-worktree "${RUNNER_TEMP}/integration-target")
          fi
          python3 -I "${RUNNER_TEMP}/integration_ci.py" "${prepare_args[@]}"
          echo "identity=$(cat "${RUNNER_TEMP}/integration.json")" >>"${GITHUB_OUTPUT}"
          python3 -I - "${RUNNER_TEMP}/integration.json" "${GITHUB_OUTPUT}" <<'PY'
          import json, pathlib, sys
          identity=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[2]).open("a",encoding="utf-8") as output:
              output.write("worktree="+identity.get("integration_worktree","")+"\n")
          PY
      - name: Run disposable Windows PowerShell rollout behavior fixture
        shell: bash
        env:
          OASIS7_WINDOWS_POWERSHELL_BEHAVIOR_TEST: "1"
          INTEGRATION_WORKTREE: ${{ steps.integration.outputs.worktree }}
        run: |
          set -euo pipefail
          if [[ -n "${INTEGRATION_WORKTREE}" ]]; then cd "${INTEGRATION_WORKTREE}"; fi
          bash ./scripts/p2p-public-testnet-package-rollout.test.sh

  testnet-packages-macos-arm64-contract:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    needs: required-gate
    if: >-
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation')) &&
      ((needs.required-gate.outputs.execution_contract == 'required-domain-split/v1' && needs.required-gate.outputs.run_packaging_contracts == 'true') ||
       (needs.required-gate.outputs.execution_contract != 'required-domain-split/v1' && needs.required-gate.outputs.run_operational_contracts == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
