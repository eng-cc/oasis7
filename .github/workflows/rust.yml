  full-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full-regression-v1
          cache-on-failure: true
      - name: Install pinned trunk
        run: cargo install trunk --locked --version "${TRUNK_VERSION}"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Run full test tier
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full

      - name: Run Rust governance report
        if: always()
        run: ./scripts/ci-rust-governance-report.sh --out-dir output/rust-governance

      - name: Append Rust governance summary
        if: always()
        run: cat output/rust-governance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust governance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-governance-report
          path: output/rust-governance
          if-no-files-found: error

  full-escalation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full_escalation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: preflight
        name: Validate human-authorized full escalation
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_UID: ${{ inputs.task_uid }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ESCALATION_REASON: ${{ inputs.escalation_reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 -I - <<'PY'
          import json, os, re, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          repository=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}"],text=True))
          default=repository.get("default_branch")
          if os.environ["GITHUB_REF"] != f"refs/heads/{default}" or os.environ["GITHUB_WORKFLOW_SHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("full escalation must execute trusted current default-branch workflow authority")
          pr=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/pulls/{os.environ['PR_NUMBER']}"],text=True))
          if (pr.get("state") != "open" or pr.get("merged")
              or (pr.get("base") or {}).get("ref") != default
              or (pr.get("base") or {}).get("sha") != os.environ["GITHUB_SHA"]
              or (pr.get("head") or {}).get("sha") != os.environ["EXPECTED_HEAD"]):
              raise SystemExit("full escalation live PR source/target identity mismatch")
          refs=re.findall(r"(?:Refs|Fixes|Closes)\s+#([0-9]+)",pr.get("body") or "",re.I)
          if len(refs) != 1:
              raise SystemExit("full escalation requires one reciprocal task Issue")
          issue=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/issues/{refs[0]}"],text=True))
          body=(issue.get("body") or "").replace("\r\n","\n")
          if re.findall(r"^task_uid: (task_[0-9a-f]{32})$",body,re.M) != [os.environ["TASK_UID"]]:
              raise SystemExit("full escalation live task UID mismatch")
          if re.findall(r"^- pr_number: `([0-9]+)`$",body,re.M) != [os.environ["PR_NUMBER"]]:
              raise SystemExit("full escalation live task/PR binding mismatch")
          PY
          python3 ./scripts/full-escalation-receipt.py validate \
            --trigger "${GITHUB_EVENT_NAME}" --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --actor "${GITHUB_ACTOR}" \
            --task-uid "${TASK_UID}" --pr-number "${PR_NUMBER}" --expected-head "${EXPECTED_HEAD}" \
            --escalation-reason "${ESCALATION_REASON}" --evidence-url "${EVIDENCE_URL}" \
            --ref "${GITHUB_REF}" --actual-head "${actual_head}" --workflow-commit "${GITHUB_SHA}" \
            --command 'CI_VERBOSE=1 ./scripts/ci-tests.sh full' --started-at "${started_at}" \
            --finished-at "${started_at}" --conclusion skipped
          echo "actual_head=${actual_head}" >>"${GITHUB_OUTPUT}"
          echo "started_at=${started_at}" >>"${GITHUB_OUTPUT}"
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@v6
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full-escalation-v1
          cache-on-failure: true
      - name: Install pinned trunk
        run: cargo install trunk --locked --version "${TRUNK_VERSION}"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - id: full
        name: Run human-authorized full test tier
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full
      - name: Write full escalation receipt
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        env:
          TASK_UID: ${{ inputs.task_uid }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ESCALATION_REASON: ${{ inputs.escalation_reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          mkdir -p output/full-escalation
          finished_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 ./scripts/full-escalation-receipt.py receipt \
            --trigger "${GITHUB_EVENT_NAME}" --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --actor "${GITHUB_ACTOR}" \
            --task-uid "${TASK_UID}" --pr-number "${PR_NUMBER}" --expected-head "${EXPECTED_HEAD}" \
            --escalation-reason "${ESCALATION_REASON}" --evidence-url "${EVIDENCE_URL}" \
            --ref "${GITHUB_REF}" --actual-head "${{ steps.preflight.outputs.actual_head }}" --workflow-commit "${GITHUB_SHA}" \
            --command 'CI_VERBOSE=1 ./scripts/ci-tests.sh full' --started-at "${{ steps.preflight.outputs.started_at }}" \
            --finished-at "${finished_at}" --conclusion "${{ steps.full.outcome }}" \
            --output output/full-escalation/oasis7-full-escalation-receipt-v1.json
      - name: Upload full escalation receipt
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: oasis7-full-escalation-receipt-v1
          path: output/full-escalation/oasis7-full-escalation-receipt-v1.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

