        run: python scripts/p2p-public-testnet-fleet-health.test.py

      - name: Ensure Linux process inspection dependency
        if: runner.os == 'Linux'
        shell: bash
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Verify cleanup on native host
        if: runner.os != 'Windows'
        shell: bash
        run: python3 ./scripts/resource-cleanup-executor.test.py --host-smoke

  required-gate:
    name: required-gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    needs: [select, baseline, rust-baseline, oasis7-required, consensus, distfs, node, net, viewer-js-required, viewer-performance-report, pixel-world-bridge, launcher-web, workspace-support, scenario-regression, operational-contracts, packaging-contracts, workflow-governance, codex-agent-config-validation, compile-metrics, site-quality, doc-checker-contracts, cargo-tooling-contracts, windows-rollout, macos-package-contract, fleet-health]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - name: Validate all expected results
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 "$RUNNER_TEMP/ci-authority/ci-required-result.py" --plan "$PLAN" --needs "$NEEDS"

  full-regression:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/oasis7_viewer/package-lock.json
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full-regression-v1
          cache-on-failure: true
      - name: Cache pinned Trunk release archive
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz
          key: trunk-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('scripts/install-ci-trunk.sh') }}
      - name: Install verified pinned Trunk
        shell: bash
        run: bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Run full test tier
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full

      - name: Run Rust governance report
        if: always()
        run: ./scripts/ci-rust-governance-report.sh --out-dir output/rust-governance

      - name: Append Rust governance summary
        if: always()
        run: cat output/rust-governance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust governance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-governance-report
          path: output/rust-governance
          if-no-files-found: error

  newapi-bridge-package:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'newapi_bridge_package'
    name: newapi-bridge-linux-x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: newapi-bridge-service-linux-x86-64-v1
          cache-on-failure: true

      - name: Build and stage deployable artifact
        run: |
          ./scripts/newapi-bridge-service/package-newapi-bridge-service.sh \
            --profile "${{ inputs.newapi_bridge_build_profile }}" \
            --archive output/newapi-bridge-service-linux-x86_64.tar.gz

      - name: Upload NewAPI bridge service artifact
        uses: actions/upload-artifact@v7
        with:
          name: newapi-bridge-service-linux-x86_64-${{ github.sha }}
          path: output/newapi-bridge-service-linux-x86_64.tar.gz
          if-no-files-found: error
