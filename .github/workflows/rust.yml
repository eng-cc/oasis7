name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual product verification or package build"
        required: true
        default: full
        type: choice
        options: [full, newapi_bridge_package]
      newapi_bridge_build_profile:
        description: "Cargo package profile"
        required: true
        default: release
        type: choice
        options: [release, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.96.0
  TRUNK_VERSION: 0.21.14
  OASIS7_WASM_TOOLCHAIN: nightly-2025-12-11
  OASIS7_WASM_TARGET: wasm32-unknown-unknown
  OASIS7_WASM_BUILD_STD: "1"
  OASIS7_WASM_BUILD_STD_COMPONENTS: std,panic_abort

jobs:
  select:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      run_baseline: ${{ steps.select.outputs.run_baseline }}
      matrix_baseline: ${{ steps.select.outputs.matrix_baseline }}
      run_rust_baseline: ${{ steps.select.outputs.run_rust_baseline }}
      matrix_rust_baseline: ${{ steps.select.outputs.matrix_rust_baseline }}
      run_oasis7_required: ${{ steps.select.outputs.run_oasis7_required }}
      matrix_oasis7_required: ${{ steps.select.outputs.matrix_oasis7_required }}
      run_consensus: ${{ steps.select.outputs.run_consensus }}
      matrix_consensus: ${{ steps.select.outputs.matrix_consensus }}
      run_distfs: ${{ steps.select.outputs.run_distfs }}
      matrix_distfs: ${{ steps.select.outputs.matrix_distfs }}
      run_node: ${{ steps.select.outputs.run_node }}
      matrix_node: ${{ steps.select.outputs.matrix_node }}
      run_net: ${{ steps.select.outputs.run_net }}
      matrix_net: ${{ steps.select.outputs.matrix_net }}
      run_viewer_js_required: ${{ steps.select.outputs.run_viewer_js_required }}
      matrix_viewer_js_required: ${{ steps.select.outputs.matrix_viewer_js_required }}
      run_viewer_performance_report: ${{ steps.select.outputs.run_viewer_performance_report }}
      matrix_viewer_performance_report: ${{ steps.select.outputs.matrix_viewer_performance_report }}
      run_pixel_world_bridge: ${{ steps.select.outputs.run_pixel_world_bridge }}
      matrix_pixel_world_bridge: ${{ steps.select.outputs.matrix_pixel_world_bridge }}
      run_launcher_web: ${{ steps.select.outputs.run_launcher_web }}
      matrix_launcher_web: ${{ steps.select.outputs.matrix_launcher_web }}
      run_workspace_support: ${{ steps.select.outputs.run_workspace_support }}
      matrix_workspace_support: ${{ steps.select.outputs.matrix_workspace_support }}
      run_scenario_regression: ${{ steps.select.outputs.run_scenario_regression }}
      matrix_scenario_regression: ${{ steps.select.outputs.matrix_scenario_regression }}
      run_operational_contracts: ${{ steps.select.outputs.run_operational_contracts }}
      matrix_operational_contracts: ${{ steps.select.outputs.matrix_operational_contracts }}
      run_packaging_contracts: ${{ steps.select.outputs.run_packaging_contracts }}
      matrix_packaging_contracts: ${{ steps.select.outputs.matrix_packaging_contracts }}
      run_workflow_governance: ${{ steps.select.outputs.run_workflow_governance }}
      matrix_workflow_governance: ${{ steps.select.outputs.matrix_workflow_governance }}
      run_codex_agent_config_validation: ${{ steps.select.outputs.run_codex_agent_config_validation }}
      matrix_codex_agent_config_validation: ${{ steps.select.outputs.matrix_codex_agent_config_validation }}
      run_compile_metrics: ${{ steps.select.outputs.run_compile_metrics }}
      matrix_compile_metrics: ${{ steps.select.outputs.matrix_compile_metrics }}
      run_site_quality: ${{ steps.select.outputs.run_site_quality }}
      matrix_site_quality: ${{ steps.select.outputs.matrix_site_quality }}
      run_doc_checker_contracts: ${{ steps.select.outputs.run_doc_checker_contracts }}
      matrix_doc_checker_contracts: ${{ steps.select.outputs.matrix_doc_checker_contracts }}
      run_cargo_tooling_contracts: ${{ steps.select.outputs.run_cargo_tooling_contracts }}
      matrix_cargo_tooling_contracts: ${{ steps.select.outputs.matrix_cargo_tooling_contracts }}
      run_windows_rollout: ${{ steps.select.outputs.run_windows_rollout }}
      matrix_windows_rollout: ${{ steps.select.outputs.matrix_windows_rollout }}
      run_macos_package_contract: ${{ steps.select.outputs.run_macos_package_contract }}
      matrix_macos_package_contract: ${{ steps.select.outputs.matrix_macos_package_contract }}
      run_fleet_health: ${{ steps.select.outputs.run_fleet_health }}
      matrix_fleet_health: ${{ steps.select.outputs.matrix_fleet_health }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: select
        name: Select using trusted baseline Git data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          tested_sha="$(git rev-parse HEAD)"
          authority="$RUNNER_TEMP/ci-authority"
          mkdir -p "$authority"
          if git cat-file -e "${BASE_SHA}:scripts/ci-required-scope.json" 2>/dev/null; then
            for file in plan-rust-required-scope.py ci-required-scope.json ci-tests.sh ci-required-result.py viewer-dependency-preflight.sh find-python-with-module.sh; do
              git show "${BASE_SHA}:scripts/${file}" >"${authority}/${file}"
            done
            python3 "$authority/plan-rust-required-scope.py"               --base-ref "$BASE_SHA" --head-ref "$SOURCE_SHA" --test-ref "$tested_sha"               --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/selection.json"
          else
            # One conservative bootstrap for a baseline predating this interface.
            # The first migration PR is independently reviewed and runs all ordinary groups.
            git cat-file -e "${BASE_SHA}:scripts/ci-required-scope.v2.json"
            cp scripts/ci-tests.sh scripts/ci-required-result.py scripts/viewer-dependency-preflight.sh scripts/find-python-with-module.sh "$authority/"
            python3 - "$GITHUB_OUTPUT" "$RUNNER_TEMP/selection.json" "$authority/ci-required-scope.json" <<'PYTHON'
          import json, pathlib, sys
          groups = ['baseline', 'rust_baseline', 'oasis7_required', 'consensus', 'distfs', 'node', 'net', 'viewer_js_required', 'viewer_performance_report', 'pixel_world_bridge', 'launcher_web', 'workspace_support', 'scenario_regression', 'operational_contracts', 'packaging_contracts', 'workflow_governance', 'codex_agent_config_validation', 'compile_metrics', 'site_quality', 'doc_checker_contracts', 'cargo_tooling_contracts', 'windows_rollout', 'macos_package_contract', 'fleet_health']
          plan = {"groups": groups, "matrices": {g: {"include": [{"group": g}]} for g in groups},
                  "resources": ["python", "markdown", "rust_toolchain", "node", "system_deps", "wasm_target", "trunk"], "scope": "full", "reasons": ["migration baseline predates pure selector; all ordinary groups required"]}
          encoded = json.dumps(plan, separators=(",", ":"))
          pathlib.Path(sys.argv[2]).write_text(encoded)
          pathlib.Path(sys.argv[3]).write_text(json.dumps({"groups": groups}))
          with open(sys.argv[1], "a") as output:
              output.write("plan=" + encoded + "\n")
              for group in groups:
                  output.write("run_" + group + "=true\n")
                  output.write("matrix_" + group + "=" + json.dumps(plan["matrices"][group], separators=(",", ":")) + "\n")
          PYTHON
          fi
          printf 'Base: %s\nSource HEAD: %s\nTested merge: %s\n' "$BASE_SHA" "$SOURCE_SHA" "$tested_sha" >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/selection.json" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
          if-no-files-found: error
          retention-days: 1

  baseline:
    needs: select
    if: needs.select.outputs.run_baseline == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_baseline) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Markdown runtime
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  rust-baseline:
    needs: select
    if: needs.select.outputs.run_rust_baseline == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_rust_baseline) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  oasis7-required:
    needs: select
    if: needs.select.outputs.run_oasis7_required == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_oasis7_required) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  consensus:
    needs: select
    if: needs.select.outputs.run_consensus == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_consensus) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  distfs:
    needs: select
    if: needs.select.outputs.run_distfs == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_distfs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  node:
    needs: select
    if: needs.select.outputs.run_node == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_node) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  net:
    needs: select
    if: needs.select.outputs.run_net == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_net) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  viewer-js-required:
    needs: select
    if: needs.select.outputs.run_viewer_js_required == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_viewer_js_required) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install viewer dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"

  viewer-performance-report:
    needs: select
    if: needs.select.outputs.run_viewer_performance_report == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_viewer_performance_report) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install viewer dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add "$OASIS7_WASM_TARGET" --toolchain "$OASIS7_WASM_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ordinary-required
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - name: Execute selected cell
        shell: bash
        env:
          CI_VERBOSE: "1"
          OASIS7_PRODUCT_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OASIS7_PRODUCT_DOC_HEAD: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/ci-authority/ci-tests.sh" required --group "${{ matrix.group }}" --repo-root "$GITHUB_WORKSPACE"
      - name: Upload Viewer performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci/viewer-performance/**
          if-no-files-found: error
          retention-days: 7

  pixel-world-bridge:
    needs: select
    if: needs.select.outputs.run_pixel_world_bridge == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix_pixel_world_bridge) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ci-authority
          path: ${{ runner.temp }}/ci-authority
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile default --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$OASIS7_WASM_TOOLCHAIN" --profile minimal --component rust-src
