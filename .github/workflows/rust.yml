      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-full-regression-trusted-v2
          add-rust-environment-hash-key: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OASIS7_WASM
          cache-on-failure: true
      - name: Cache pinned Trunk release archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz
          key: trunk-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.TRUNK_VERSION }}-${{ hashFiles('scripts/install-ci-trunk.sh') }}
      - name: Install verified pinned Trunk
        shell: bash
        run: bash scripts/install-ci-trunk.sh "$RUNNER_TEMP/ci-tools/trunk-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/ci-tools/bin"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Prepare trusted cache sentinel
        if: github.ref == 'refs/heads/main'
        run: |
          test "$ACTIONS_CACHE_MODE" = write
          mkdir -p "$RUNNER_TEMP/cache-permission-sentinel"
          printf 'trusted-v2\n' > "$RUNNER_TEMP/cache-permission-sentinel/sentinel"
      - name: Save trusted cache sentinel
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cache-permission-sentinel
          key: oasis7-cache-permission-sentinel-trusted-v2
      - name: Run full test tier
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full

      - name: Run Rust governance report
        if: always()
        run: ./scripts/ci-rust-governance-report.sh --out-dir output/rust-governance

      - name: Append Rust governance summary
        if: always()
        run: cat output/rust-governance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-governance-report
          path: output/rust-governance
          if-no-files-found: error

  newapi-bridge-package:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'newapi_bridge_package'
    name: newapi-bridge-linux-x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: newapi-bridge-service-linux-x86-64-trusted-v2
          cache-on-failure: true

      - name: Build and stage deployable artifact
        run: |
          ./scripts/newapi-bridge-service/package-newapi-bridge-service.sh \
            --profile "${{ inputs.newapi_bridge_build_profile }}" \
            --archive output/newapi-bridge-service-linux-x86_64.tar.gz

      - name: Upload NewAPI bridge service artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: newapi-bridge-service-linux-x86_64-${{ github.sha }}
          path: output/newapi-bridge-service-linux-x86_64.tar.gz
          if-no-files-found: error
