          GH_TOKEN: ${{ github.token }}
          INTEGRATION_BASE: ${{ inputs.integration_base }}
          INTEGRATION_HEAD: ${{ inputs.expected_head }}
          INTEGRATION_UID: ${{ inputs.task_uid }}
          INTEGRATION_PR: ${{ inputs.pr_number }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INTEGRATION_REQUEST_KEY: ${{ inputs.request_key }}
          INTEGRATION_REQUEST_B64: ${{ inputs.validation_request_b64 }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/integration-planner"
          cp scripts/plan-rust-required-scope.py scripts/ci-required-scope.v2.json scripts/ci-tests.sh "${RUNNER_TEMP}/integration-planner/"
          cp -R scripts/pm/. "${RUNNER_TEMP}/integration-planner/pm/"
          cp -R scripts/pm/. "${RUNNER_TEMP}/"
          prepare_args=(prepare --repository "${{ github.repository }}" \
            --task-uid "${INTEGRATION_UID}" --pr-number "${INTEGRATION_PR}" \
            --base "${INTEGRATION_BASE}" --head "${INTEGRATION_HEAD}" --output "${RUNNER_TEMP}/integration.json")
          if [[ -n "${INTEGRATION_REQUEST_KEY}" || -n "${INTEGRATION_REQUEST_B64}" ]]; then
            [[ -n "${INTEGRATION_REQUEST_KEY}" && -n "${INTEGRATION_REQUEST_B64}" ]] || exit 1
            python3 -I scripts/pm/ci_reuse_policy.py trusted-context --root "${GITHUB_WORKSPACE}" \
              --repository "${GITHUB_REPOSITORY}" --default-branch "${GITHUB_DEFAULT_BRANCH}" \
              --workflow-ref "${GITHUB_WORKFLOW_REF}" --workflow-sha "${GITHUB_WORKFLOW_SHA}" \
              --default-branch-sha "${GITHUB_SHA}" --output "${RUNNER_TEMP}/trusted-ci-policy.json"
            prepare_args+=(--request-key "${INTEGRATION_REQUEST_KEY}" \
              --validation-request-b64 "${INTEGRATION_REQUEST_B64}" \
              --trusted-policy-json "${RUNNER_TEMP}/trusted-ci-policy.json" \
              --integration-worktree "${RUNNER_TEMP}/integration-target")
          fi
          python3 -I "${RUNNER_TEMP}/integration_ci.py" "${prepare_args[@]}"
          echo "identity=$(cat "${RUNNER_TEMP}/integration.json")" >>"${GITHUB_OUTPUT}"
          python3 -I - "${RUNNER_TEMP}/integration.json" "${GITHUB_OUTPUT}" <<'PY'
          import json, pathlib, sys
          identity=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[2]).open("a",encoding="utf-8") as output:
              output.write("worktree="+identity.get("integration_worktree","")+"\n")
          PY
      - name: Verify fleet-health collection contract
        env:
          INTEGRATION_WORKTREE: ${{ steps.integration.outputs.worktree }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INTEGRATION_WORKTREE}" ]]; then cd "${INTEGRATION_WORKTREE}"; fi
          python scripts/p2p-public-testnet-fleet-health.test.py

  required-result-v2:
    permissions:
      actions: read
      checks: read
      contents: read
    needs:
      - required-gate
      - windows-package-rollout-behavior
      - testnet-packages-macos-arm64-contract
      - public-testnet-fleet-health-contract
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'integration_revalidation' && inputs.request_key != '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.required-gate.outputs.required_unit_matrix || '[]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Resolve trusted v2 producer policy for workflow W
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -I scripts/pm/ci_reuse_policy.py trusted-context \
            --root "${GITHUB_WORKSPACE}" --repository "${GITHUB_REPOSITORY}" \
            --default-branch "${GITHUB_DEFAULT_BRANCH}" --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --workflow-sha "${GITHUB_WORKFLOW_SHA}" --default-branch-sha "${GITHUB_WORKFLOW_SHA}" \
            --output "${RUNNER_TEMP}/trusted-ci-policy.json"
      - name: Download exact attempt required plan v2
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.required-gate.outputs.required_plan_v2_artifact_name }}
          path: ${{ runner.temp }}/required-plan-v2
      - name: Resolve exact trusted execution layout for result reader
        run: |
          python3 -I scripts/pm/integration_executor_contract.py layout --root "${GITHUB_WORKSPACE}" >"${RUNNER_TEMP}/required-executor-context.json"
      - name: Resolve completed exact-attempt jobs and create unit result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RESULT_UNIT_ID: ${{ matrix.unit.unit_id }}
          RESULT_PLAN_ARTIFACT_ID: ${{ needs.required-gate.outputs.required_plan_v2_artifact_id }}
        run: |
          set -euo pipefail
          python3 -I - "${RUNNER_TEMP}/required-plan-v2/oasis7-required-plan-v2.json" \
            "${RESULT_UNIT_ID}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" "${GITHUB_WORKFLOW_SHA}" \
            "${RUNNER_TEMP}/trusted-ci-policy.json" "${RUNNER_TEMP}/execution-jobs.json" <<'PY'
          import json, pathlib, subprocess, sys
          plan_path,unit_id,repository,run_id,attempt,workflow_sha,policy_path,output=sys.argv[1:]
          plan=json.loads(pathlib.Path(plan_path).read_text(encoding="utf-8"))
          policy=json.loads(pathlib.Path(policy_path).read_text(encoding="utf-8"))
          if unit_id not in plan["required_test_units"]:
              raise SystemExit("result unit is outside the required plan")
          names=["required-gate",*plan["execution_job_requirements"][unit_id]]
          command=[sys.executable,"-I","scripts/pm/integration_ci.py","attempt-jobs",
                   "--repository",repository,"--run-id",run_id,"--run-attempt",attempt,
                   "--workflow-sha",workflow_sha,"--check-app-id",
                   str(policy["effective_policy"]["check_app_id"]),"--require-completed",
                   "--output",output]
          for name in names:
              command.extend(("--job-name",name))
          subprocess.run(command,check=True)
          PY
          python3 -I scripts/pm/ci_required_artifact_v2.py build-result \
            --plan "${RUNNER_TEMP}/required-plan-v2/oasis7-required-plan-v2.json" \
            --plan-artifact-id "${RESULT_PLAN_ARTIFACT_ID}" \
            --execution-jobs "${RUNNER_TEMP}/execution-jobs.json" \
            --trusted-executor-context "${RUNNER_TEMP}/required-executor-context.json" \
            --unit-id "${RESULT_UNIT_ID}" \
            --output "${RUNNER_TEMP}/oasis7-required-result-v2.json"
      - name: Upload exact-attempt per-unit required result v2
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.unit.artifact_name }}
          path: ${{ runner.temp }}/oasis7-required-result-v2.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  full-regression:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full-regression-v1
          cache-on-failure: true
      - name: Install pinned trunk
        run: cargo install trunk --locked --version "${TRUNK_VERSION}"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - name: Run full test tier
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full

      - name: Run Rust governance report
        if: always()
        run: ./scripts/ci-rust-governance-report.sh --out-dir output/rust-governance

      - name: Append Rust governance summary
        if: always()
        run: cat output/rust-governance/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust governance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-governance-report
          path: output/rust-governance
          if-no-files-found: error

  full-escalation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full_escalation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: preflight
        name: Validate human-authorized full escalation
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_UID: ${{ inputs.task_uid }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ESCALATION_REASON: ${{ inputs.escalation_reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 -I - <<'PY'
          import json, os, re, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          repository=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}"],text=True))
          default=repository.get("default_branch")
          if os.environ["GITHUB_REF"] != f"refs/heads/{default}" or os.environ["GITHUB_WORKFLOW_SHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("full escalation must execute trusted current default-branch workflow authority")
          pr=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/pulls/{os.environ['PR_NUMBER']}"],text=True))
          if (pr.get("state") != "open" or pr.get("merged")
              or (pr.get("base") or {}).get("ref") != default
              or (pr.get("base") or {}).get("sha") != os.environ["GITHUB_SHA"]
              or (pr.get("head") or {}).get("sha") != os.environ["EXPECTED_HEAD"]):
              raise SystemExit("full escalation live PR source/target identity mismatch")
          refs=re.findall(r"(?:Refs|Fixes|Closes)\s+#([0-9]+)",pr.get("body") or "",re.I)
          if len(refs) != 1:
              raise SystemExit("full escalation requires one reciprocal task Issue")
          issue=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/issues/{refs[0]}"],text=True))
          body=(issue.get("body") or "").replace("\r\n","\n")
          if re.findall(r"^task_uid: (task_[0-9a-f]{32})$",body,re.M) != [os.environ["TASK_UID"]]:
              raise SystemExit("full escalation live task UID mismatch")
          if re.findall(r"^- pr_number: `([0-9]+)`$",body,re.M) != [os.environ["PR_NUMBER"]]:
              raise SystemExit("full escalation live task/PR binding mismatch")
          PY
          python3 ./scripts/full-escalation-receipt.py validate \
            --trigger "${GITHUB_EVENT_NAME}" --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --actor "${GITHUB_ACTOR}" \
            --task-uid "${TASK_UID}" --pr-number "${PR_NUMBER}" --expected-head "${EXPECTED_HEAD}" \
            --escalation-reason "${ESCALATION_REASON}" --evidence-url "${EVIDENCE_URL}" \
            --ref "${GITHUB_REF}" --actual-head "${actual_head}" --workflow-commit "${GITHUB_SHA}" \
            --command 'CI_VERBOSE=1 ./scripts/ci-tests.sh full' --started-at "${started_at}" \
            --finished-at "${started_at}" --conclusion skipped
          echo "actual_head=${actual_head}" >>"${GITHUB_OUTPUT}"
          echo "started_at=${started_at}" >>"${GITHUB_OUTPUT}"
      - name: Resolve product-document gate range
        shell: bash
        run: |
          set -euo pipefail
          base_oid="$(git rev-parse --verify 'HEAD^1')"
          head_oid="$(git rev-parse --verify 'HEAD^{commit}')"
          printf 'OASIS7_PRODUCT_DOC_BASE=%s\n' "$base_oid" >>"$GITHUB_ENV"
          printf 'OASIS7_PRODUCT_DOC_HEAD=%s\n' "$head_oid" >>"$GITHUB_ENV"
      - uses: actions/setup-node@v6
      - name: Install viewer web dependencies
        run: npm ci --prefix crates/oasis7_viewer
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile default --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustup toolchain install "${OASIS7_WASM_TOOLCHAIN}" --profile minimal --component rust-src
          rustup target add "${OASIS7_WASM_TARGET}" --toolchain "${OASIS7_WASM_TOOLCHAIN}"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full-escalation-v1
          cache-on-failure: true
      - name: Install pinned trunk
        run: cargo install trunk --locked --version "${TRUNK_VERSION}"
      - name: Verify pinned trunk
        shell: bash
        run: |
          set -euo pipefail
          trunk --version | grep -Fqx "trunk ${TRUNK_VERSION}"
      - name: Install product-document Markdown parser
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/doc-governance-requirements.txt
      - id: full
        name: Run human-authorized full test tier
        run: CI_VERBOSE=1 ./scripts/ci-tests.sh full
      - name: Write full escalation receipt
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        env:
          TASK_UID: ${{ inputs.task_uid }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ESCALATION_REASON: ${{ inputs.escalation_reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          mkdir -p output/full-escalation
          finished_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 ./scripts/full-escalation-receipt.py receipt \
            --trigger "${GITHUB_EVENT_NAME}" --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" --actor "${GITHUB_ACTOR}" \
            --task-uid "${TASK_UID}" --pr-number "${PR_NUMBER}" --expected-head "${EXPECTED_HEAD}" \
            --escalation-reason "${ESCALATION_REASON}" --evidence-url "${EVIDENCE_URL}" \
            --ref "${GITHUB_REF}" --actual-head "${{ steps.preflight.outputs.actual_head }}" --workflow-commit "${GITHUB_SHA}" \
            --command 'CI_VERBOSE=1 ./scripts/ci-tests.sh full' --started-at "${{ steps.preflight.outputs.started_at }}" \
            --finished-at "${finished_at}" --conclusion "${{ steps.full.outcome }}" \
            --output output/full-escalation/oasis7-full-escalation-receipt-v1.json
      - name: Upload full escalation receipt
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: oasis7-full-escalation-receipt-v1
          path: output/full-escalation/oasis7-full-escalation-receipt-v1.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

