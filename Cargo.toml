[workspace]
members = [
    "crates/oasis7",
    "crates/oasis7_client_launcher",
    "crates/oasis7_launcher_ui",
    "crates/oasis7_consensus",
    "crates/oasis7_distfs",
    "crates/oasis7_net",
    "crates/oasis7_node",
    "crates/pixel_world_bridge",
    "crates/oasis7_proto",
    "crates/oasis7_wasm_build",
    "crates/oasis7_wasm_abi",
    "crates/oasis7_wasm_executor",
    "crates/oasis7_wasm_sdk",
    "crates/oasis7_wasm_router",
    "crates/oasis7_wasm_store",
]
resolver = "2"

[profile.release]
# Keep release artifacts small without changing the panic strategy used by
# runtime binaries. Symbol stripping reduces distribution size (and can reduce
# postmortem symbolization), while thin LTO with one codegen unit keeps
# cross-crate optimization effective without the full-LTO build-time cost.
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev.package.epaint]
# On wasm32-unknown-unknown, `std::time::Instant` is unavailable.
# epaint's debug deadlock checks call `parking_lot::try_*_for`, which panics there.
debug-assertions = false

[patch.crates-io]
egui-winit = { path = "vendor-egui-winit-0.33.3" }
