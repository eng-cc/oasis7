[package]
name = "oasis7_wasm_materializer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_distfs = { path = "../oasis7_distfs" }
oasis7_proto = { path = "../oasis7_proto" }
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13.4", features = ["blocking", "rustls"], default-features = false }
