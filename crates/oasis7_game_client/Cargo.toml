[package]
name = "oasis7_game_client"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_client_api = { path = "../oasis7_client_api" }
oasis7_agent_api = { path = "../oasis7_agent_api" }
serde_ignored = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "3"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
zeroize = "1"

blake3 = "1"
serde_cbor = "0.11"
oasis7_wasm_abi = { path = "../oasis7_wasm_abi" }

[target.'cfg(unix)'.dependencies]
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
