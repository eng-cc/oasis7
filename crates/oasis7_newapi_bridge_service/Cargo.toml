[package]
name = "oasis7_newapi_bridge_service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
oasis7_observability = { path = "../oasis7_observability" }
oasis7_letai_credit_adapter = { path = "../oasis7_letai_credit_adapter" }
reqwest = { version = "0.13.4", features = ["blocking", "json", "query", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
