[package]
name = "oasis7"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oasis7_chain_runtime"
path = "src/bin/oasis7_chain_runtime.rs"
required-features = ["node-libp2p"]

[dependencies]
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
oasis7_wasm_abi = { version = "0.1.0", path = "../oasis7_wasm_abi" }
hex = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
blake3 = "1"
multiaddr = "0.18"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = "0.10"
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aliyun-tablestore-rs = { version = "0.1.2", default-features = false, features = ["rust-tls"] }
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs" }
oasis7_launcher_ui = { version = "0.1.0", path = "../oasis7_launcher_ui" }
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false }
oasis7_wasm_executor = { version = "0.1.0", path = "../oasis7_wasm_executor", default-features = false }
oasis7_wasm_router = { version = "0.1.0", path = "../oasis7_wasm_router" }
oasis7_wasm_store = { version = "0.1.0", path = "../oasis7_wasm_store" }
async-openai = { version = "0.41.3", default-features = false, features = ["responses", "rustls"] }
ctrlc = { version = "3.4", features = ["termination"] }
futures-util = "0.3"
hmac = "0.13"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.9.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
tungstenite = "0.30.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["wasmtime", "node-libp2p"]
node-libp2p = ["oasis7_node/libp2p"]
wasmtime = ["oasis7_wasm_executor/wasmtime"]
viewer_live_integration = []
test_tier_required = []
test_tier_full = ["test_tier_required"]

[dev-dependencies]
oasis7_node = { version = "0.1.0", path = "../oasis7_node", default-features = false, features = ["test-hooks"] }
