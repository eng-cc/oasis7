[package]
name = "oasis7_node"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = ["libp2p"]
libp2p = ["dep:futures", "dep:libp2p", "oasis7_net/libp2p"]
test-hooks = []

[dependencies]
oasis7_consensus = { version = "0.1.0", path = "../oasis7_consensus" }
oasis7_distfs = { version = "0.1.0", path = "../oasis7_distfs" }
oasis7_proto = { version = "0.1.0", path = "../oasis7_proto" }
ed25519-dalek = "2"
futures = { version = "0.3", optional = true }
hex = "0.4"
libp2p = { version = "0.56", optional = true, default-features = false, features = ["cbor", "gossipsub", "macros", "noise", "request-response", "tcp", "tokio", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oasis7_net = { version = "0.1.0", path = "../oasis7_net", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
