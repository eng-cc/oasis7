[package]
name = "oasis7_secure_envelope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
