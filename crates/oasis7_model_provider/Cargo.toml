[package]
name = "oasis7_model_provider"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Session-scoped model consumption for the first-party Oasis7 Agent"

[dependencies]
oasis7_agent_harness = { path = "../oasis7_agent_harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
hex = "0.4"
zeroize = "1"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], default-features = false }
