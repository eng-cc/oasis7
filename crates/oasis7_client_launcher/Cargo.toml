[package]
name = "oasis7_client_launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
oasis7 = { path = "../oasis7", default-features = false }
oasis7_launcher_ui = { path = "../oasis7_launcher_ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow"] }
gloo-net = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
web-time = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
