<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oasis7 Viewer (Software-Safe)</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b100f;
        --bg-deep: #050807;
        --panel: rgba(16, 20, 18, 0.9);
        --panel-strong: rgba(22, 29, 25, 0.98);
        --panel-stage: linear-gradient(180deg, rgba(21, 27, 24, 0.96), rgba(11, 15, 13, 0.98));
        --border: rgba(152, 177, 150, 0.18);
        --border-strong: rgba(198, 169, 107, 0.34);
        --text: #edf1e6;
        --muted: #9ca89a;
        --accent: #8dc7aa;
        --accent-strong: #d0a85b;
        --accent-soft: rgba(141, 199, 170, 0.14);
        --good: #7ed3a6;
        --warn: #dfb66b;
        --bad: #e58f76;
        --font-body: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        --font-mono: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
        --color-world-background: var(--bg);
        --color-world-depth: var(--bg-deep);
        --color-panel-surface: var(--panel);
        --color-panel-strong: var(--panel-strong);
        --color-stage-surface: var(--panel-stage);
        --color-border-subtle: var(--border);
        --color-border-stage: var(--border-strong);
        --color-text-primary: var(--text);
        --color-text-muted: var(--muted);
        --color-agent-primary: var(--accent);
        --color-objective-accent: var(--accent-strong);
        --color-route-active: var(--accent);
        --color-receipt-success: var(--good);
        --color-blocker-danger: var(--bad);
        --color-warning: var(--warn);
        --color-diagnostic-muted: var(--muted);
        --color-focus-ring: var(--accent-strong);
        --font-viewer-body: var(--font-body);
        --font-viewer-display: var(--font-display);
        --font-viewer-mono: var(--font-mono);
        --shadow-stage: 0 30px 72px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(208, 168, 91, 0.08);
        --shadow-surface: 0 18px 44px rgba(0, 0, 0, 0.32);
        --shadow-inset-stage: inset 0 1px 0 rgba(255, 255, 255, 0.055);
        --space-panel-gap: 18px;
        --space-stack-gap: 16px;
        --space-control-gap: 8px;
        --space-section-tight: 10px;
        --space-section-nudge: 8px;
        --radius-tool: 12px;
        --radius-stage: 18px;
        --radius-panel: 20px;
        --motion-feedback-fast: 140ms;
      }

      * { box-sizing: border-box; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(208, 168, 91, 0.12), transparent 26%),
          radial-gradient(circle at top right, rgba(141, 199, 170, 0.13), transparent 24%),
          linear-gradient(180deg, #141916 0%, var(--bg) 22%, var(--bg-deep) 100%);
        color: var(--text);
        font-family: var(--font-body);
      }
      body {
        padding: 24px;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.45), transparent 88%);
      }
      #app {
        position: relative;
        z-index: 1;
      }
      .shell {
        display: grid;
        grid-template-columns: minmax(240px, 280px) minmax(0, 1.55fr) minmax(300px, 360px);
        grid-template-areas: "targets stage details";
        gap: 18px;
        min-height: calc(100vh - 48px);
        align-items: start;
      }
      .panel {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)),
          var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
      }
      .panel--targets { grid-area: targets; }
      .panel--stage {
        position: relative;
        grid-area: stage;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 18%),
          var(--panel-stage);
        border-color: var(--border-strong);
        box-shadow: var(--shadow-stage);
      }
      .panel--stage::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, transparent, rgba(208, 168, 91, 0.16), transparent) top / 100% 1px no-repeat,
          linear-gradient(180deg, rgba(141, 199, 170, 0.08), transparent 22%);
      }
      .panel--details { grid-area: details; }
      body.pixel-world-focus-active {
        padding: 0;
        overflow: hidden;
      }
      body.pixel-world-focus-active::before,
      body.pixel-world-focus-active .mobile-rail,
      body.pixel-world-focus-active .panel--targets,
      body.pixel-world-focus-active .panel--details,
      body.pixel-world-focus-active .stage-hero,
      body.pixel-world-focus-active .pixel-world-host ~ * {
        display: none;
      }
      body.pixel-world-focus-active #app,
      body.pixel-world-focus-active .shell,
      body.pixel-world-focus-active .panel--stage,
      body.pixel-world-focus-active .panel--stage > .panel__body {
        display: block;
        position: static;
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        overflow: hidden;
        backdrop-filter: none;
      }
      .panel--nested {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)),
          rgba(255, 255, 255, 0.018);
        border-color: rgba(152, 177, 150, 0.14);
        box-shadow: none;
      }
      .panel--stage > .panel__body {
        padding: 20px;
      }
      .panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-strong);
      }
      .panel__header--stack {
        align-items: flex-start;
        flex-direction: column;
      }
      .panel__eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-strong);
      }
      .panel__title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .panel__meta-copy {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .panel__body {
        padding: 16px;
      }
      .panel__body--stage {
        padding: 20px;
      }
      .stack { display: flex; flex-direction: column; gap: 16px; }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .metric {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.025);
      }
      .metric__label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .metric__value {
        font-size: 18px;
        font-weight: 700;
      }
      .badge-row, .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--border);
        background: rgba(247, 242, 230, 0.04);
      }
      .badge--accent { background: var(--accent-soft); color: #d5ecdf; border-color: rgba(141, 199, 170, 0.34); }
      .badge--good { color: var(--good); }
      .badge--warn { color: var(--warn); }
      .badge--bad { color: var(--bad); }
      button {
        appearance: none;
        border: 1px solid rgba(208, 168, 91, 0.28);
        background: linear-gradient(180deg, rgba(208, 168, 91, 0.2), rgba(109, 87, 48, 0.08));
        color: var(--text);
        border-radius: 12px;
        padding: 10px 13px;
        font-size: 14px;
        cursor: pointer;
        transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
      }
      button:hover {
        border-color: rgba(208, 168, 91, 0.54);
        transform: translateY(-1px);
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      :where(a, button, canvas, summary, input, textarea, select):focus-visible {
        outline: 2px solid var(--color-focus-ring);
        outline-offset: 3px;
        box-shadow: 0 0 0 4px rgba(208, 168, 91, 0.16);
      }
      input[type="email"], input[type="number"], input[type="search"], input[type="text"], textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        padding: 9px 10px;
        resize: vertical;
        min-height: 44px;
        font: inherit;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 360px;
        overflow: auto;
      }
      .list-item {
        width: 100%;
        text-align: left;
        display: block;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        padding: 10px 12px;
      }
      .list-item[data-selected="true"] {
        border-color: rgba(141, 199, 170, 0.55);
        background: rgba(141, 199, 170, 0.12);
      }
      .list-item__title {
        font-weight: 700;
        margin-bottom: 4px;
      }
      .list-item__meta {
        color: var(--muted);
        font-size: 12px;
      }
      .event-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 420px;
        overflow: auto;
      }
      .event-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: rgba(255,255,255,0.03);
      }
      .event-card--action {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 164px;
        background:
          radial-gradient(circle at top left, rgba(208, 168, 91, 0.08), transparent 34%),
          rgba(255,255,255,0.03);
      }
      .event-card__title {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-weight: 700;
      }
      .event-card__meta {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .json {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        color: #dce7d8;
      }
      .feedback-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: rgba(255,255,255,0.03);
      }
      .feedback-summary {
        font-size: 14px;
        line-height: 1.5;
      }
      .feedback-detail {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .action-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .callout {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.03);
      }
      .callout--warn {
        border-color: rgba(223, 182, 107, 0.42);
        background: rgba(223, 182, 107, 0.08);
      }
      .callout__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .callout__title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .callout__body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .auth-gate {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(5, 8, 7, 0.72);
        backdrop-filter: blur(8px);
      }
      .auth-gate__dialog {
        width: min(560px, 100%);
        max-height: calc(100vh - 40px);
        overflow: auto;
        border: 1px solid rgba(208, 168, 91, 0.38);
        border-radius: 8px;
        padding: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0)),
          var(--panel-strong);
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.48);
      }
      .auth-gate__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }
      .auth-gate__title {
        margin: 4px 0 0;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      .pixel-world-host__summary {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pixel-world-host__headline {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .pixel-world-focus-entry {
        display: flex;
        justify-content: flex-start;
      }
      .pixel-world-command-strip {
        display: grid;
        grid-template-columns: minmax(0, 1.16fr) minmax(0, 1.08fr) minmax(0, 0.92fr);
        gap: 12px;
        padding: 3px;
        border: 1px solid rgba(152, 177, 150, 0.12);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01)),
          rgba(4, 8, 7, 0.3);
      }
      .pixel-world-command-cell {
        position: relative;
        min-height: 112px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 13px 14px 14px;
        border-radius: 8px;
        border: 1px solid rgba(141, 199, 170, 0.2);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)),
          rgba(8, 14, 12, 0.72);
        box-shadow: var(--shadow-inset-stage);
        overflow: hidden;
      }
      .pixel-world-command-cell::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: rgba(141, 199, 170, 0.46);
      }
      .pixel-world-command-cell--objective {
        border-color: rgba(110, 231, 183, 0.4);
        background:
          linear-gradient(135deg, rgba(110, 231, 183, 0.12), rgba(255, 255, 255, 0.018) 52%),
          rgba(8, 17, 13, 0.78);
      }
      .pixel-world-command-cell--objective::before {
        background: rgba(110, 231, 183, 0.82);
      }
      .pixel-world-command-cell--next {
        border-color: rgba(250, 204, 21, 0.36);
        background:
          linear-gradient(135deg, rgba(250, 204, 21, 0.1), rgba(255, 255, 255, 0.016) 56%),
          rgba(18, 15, 8, 0.76);
      }
      .pixel-world-command-cell--next::before {
        background: rgba(250, 204, 21, 0.76);
      }
      .pixel-world-command-cell--leverage {
        border-color: rgba(99, 179, 255, 0.26);
      }
      .pixel-world-command-cell--leverage::before {
        background: rgba(99, 179, 255, 0.58);
      }
      .pixel-world-action-receipt {
        display: grid;
        grid-template-columns: minmax(108px, 132px) minmax(0, 1fr) auto;
        gap: 13px;
        align-items: center;
        padding: 13px 15px;
        border: 1px solid rgba(99, 179, 255, 0.24);
        border-left: 3px solid rgba(99, 179, 255, 0.72);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(99, 179, 255, 0.13), transparent 46%),
          rgba(8, 18, 24, 0.62);
        box-shadow: var(--shadow-inset-stage), 0 12px 32px rgba(0, 0, 0, 0.18);
      }
      .pixel-world-action-receipt[data-receipt-present="false"] {
        border-color: rgba(148, 163, 184, 0.2);
        border-left-color: rgba(148, 163, 184, 0.44);
        background:
          linear-gradient(90deg, rgba(148, 163, 184, 0.07), transparent 46%),
          rgba(13, 17, 18, 0.5);
      }
      .pixel-world-action-receipt[data-receipt-state="blocked"],
      .pixel-world-action-receipt[data-receipt-state="rejected"] {
        border-color: rgba(251, 146, 60, 0.28);
        border-left-color: rgba(251, 146, 60, 0.82);
        background:
          linear-gradient(90deg, rgba(251, 146, 60, 0.14), transparent 48%),
          rgba(28, 16, 9, 0.62);
      }
      .pixel-world-action-receipt[data-receipt-state="completed"] {
        border-color: rgba(110, 231, 183, 0.26);
        border-left-color: rgba(110, 231, 183, 0.82);
        background:
          linear-gradient(90deg, rgba(110, 231, 183, 0.13), transparent 48%),
          rgba(7, 23, 17, 0.6);
      }
      .pixel-world-action-receipt__label,
      .pixel-world-action-receipt__meta {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .pixel-world-action-receipt__body {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pixel-world-action-receipt__title {
        color: #eef6f1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
      }
      .pixel-world-action-receipt__summary,
      .pixel-world-action-receipt__detail {
        color: #b8c8c0;
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .pixel-world-action-receipt__meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
        white-space: nowrap;
      }
      .pixel-world-command-cell__label {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .pixel-world-command-cell__value {
        color: #eef6f1;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .pixel-world-command-cell__detail {
        color: #b8c8c0;
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .pixel-world-readout {
        align-items: center;
      }
      .pixel-world-host--focus {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        grid-template-rows: 1fr;
        gap: 0;
        padding: 0;
        background: var(--bg-deep);
        overflow: hidden;
      }
      .pixel-world-host--focus > .pixel-world-host__summary,
      .pixel-world-host--focus > .pixel-world-command-strip,
      .pixel-world-host--focus > .pixel-world-action-receipt,
      .pixel-world-host--focus > .pixel-world-readout,
      .pixel-world-host--focus > .pixel-world-render-diagnostics,
      .pixel-world-host--focus > .diagnostic:not(.pixel-world-focus-drawer) {
        display: none;
      }
      .pixel-world-host--focus > .callout {
        position: absolute;
        z-index: 116;
        left: 16px;
        right: 16px;
        top: 82px;
        bottom: auto;
        width: auto;
        min-width: 0;
        max-height: 56px;
        overflow: auto;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(24, 14, 10, 0.82);
        backdrop-filter: blur(10px);
      }
      .pixel-world-host--focus > .callout .callout__header {
        margin-bottom: 0;
      }
      .pixel-world-host--focus > .callout .callout__body {
        display: block;
      }
      .pixel-world-host--focus > .callout .callout__body .feedback-summary {
        font-size: 11px;
        line-height: 1.25;
        max-height: 2.5em;
        overflow: hidden;
      }
      .pixel-world-host--focus > .callout .callout__body .feedback-detail {
        display: none;
      }
      .pixel-world-host--focus > .pixel-world-canvas {
        grid-row: 1;
        width: 100vw;
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
      .pixel-world-host--focus > .pixel-world-canvas--rendered {
        min-height: 0;
      }
      .pixel-world-host--focus .pixel-world-canvas__surface {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }
      .pixel-world-focus-hud {
        position: absolute;
        z-index: 120;
        top: 16px;
        left: 16px;
        right: 16px;
        display: grid;
        grid-template-columns:
          minmax(136px, 0.58fr)
          minmax(220px, 1.2fr)
          minmax(142px, 0.56fr)
          minmax(116px, 0.46fr)
          minmax(116px, 0.46fr)
          max-content;
        gap: 8px;
        align-items: center;
        pointer-events: none;
      }
      .pixel-world-focus-hud__identity,
      .pixel-world-focus-hud__cell,
      .pixel-world-focus-controls {
        border: 1px solid rgba(152, 177, 150, 0.18);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent),
          rgba(7, 12, 10, 0.68);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow-inset-stage), 0 16px 38px rgba(0, 0, 0, 0.22);
      }
      .pixel-world-focus-hud__identity,
      .pixel-world-focus-hud__cell {
        min-height: 46px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-width: 0;
      }
      .pixel-world-focus-hud__eyebrow,
      .pixel-world-focus-hud__cell span,
      .pixel-world-focus-rail__label,
