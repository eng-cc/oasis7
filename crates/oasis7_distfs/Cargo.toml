[package]
name = "oasis7_distfs"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
oasis7_proto = { path = "../oasis7_proto" }
oasis7_wasm_build = { path = "../oasis7_wasm_build", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
zstd = "0.13"

[features]
sync-builtin-wasm-identity = ["dep:oasis7_wasm_build"]

[[bin]]
name = "sync_builtin_wasm_identity"
path = "src/bin/sync_builtin_wasm_identity.rs"
required-features = ["sync-builtin-wasm-identity"]
