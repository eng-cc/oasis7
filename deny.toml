[graph]
all-features = false
no-default-features = false
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # Baseline existing dependency advisories; required CI should block net-new advisories
  # while these are burned down in follow-up dependency modernization tasks.
  # Each ignore must keep a `rustsec-ignore` metadata line immediately above it.
  # `scripts/check-rustsec-ignore-baseline.sh` fails on missing metadata, expired
  # metadata, or unreviewed changes to the approved ignore set.
  # rustsec-ignore: owner=repository_health_engineer; crate=serde_cbor; scope=workspace serde_cbor serialization debt; reason=legacy serde_cbor remains in protocol/runtime data paths pending serialization migration; expiry=2026-09-30; validation=cargo tree --all-features -i serde_cbor; local_crates=oasis7,oasis7_client_launcher,oasis7_consensus,oasis7_distfs,oasis7_net,oasis7_node,oasis7_proto,oasis7_wasm_executor,oasis7_wasm_sdk
  "RUSTSEC-2021-0127", # serde_cbor unmaintained
  # rustsec-ignore: owner=repository_health_engineer; crate=paste; scope=transitive macro dependency debt; reason=paste remains in the current dependency closure and should be removed by upstream crate modernization; expiry=2026-09-30; validation=cargo tree --target all -i paste; local_crates=oasis7,oasis7_client_launcher,oasis7_net,oasis7_node
  "RUSTSEC-2024-0436", # paste unmaintained
  # rustsec-ignore: owner=repository_health_engineer; crate=ttf-parser; scope=transitive UI font parser debt via egui/bevy/winit; reason=RUSTSEC-2026-0192 has no safe upgrade and currently enters only through launcher/viewer UI dependency closures pending upstream migration to maintained font parsing crates; expiry=2026-09-30; validation=cargo tree --locked --all-features --target all -i ttf-parser; local_crates=oasis7_client_launcher,pixel_world_bridge
  "RUSTSEC-2026-0192", # ttf-parser unmaintained
  # rustsec-ignore: owner=repository_health_engineer; crate=quick-xml; scope=transitive Wayland scanner build-time parser debt via winit/eframe/bevy Linux UI dependency closure; reason=wayland-scanner 0.31.10 still requires quick-xml ^0.39 and no compatible lockfile-only upgrade is available; expiry=2026-09-30; validation=cargo tree --locked --target all -i quick-xml; local_crates=oasis7_client_launcher,pixel_world_bridge
  "RUSTSEC-2026-0194", # quick-xml quadratic attribute duplicate check via wayland-scanner
  # rustsec-ignore: owner=repository_health_engineer; crate=quick-xml; scope=transitive Wayland scanner build-time parser debt via winit/eframe/bevy Linux UI dependency closure; reason=wayland-scanner 0.31.10 still requires quick-xml ^0.39 and no compatible lockfile-only upgrade is available; expiry=2026-09-30; validation=cargo tree --locked --target all -i quick-xml; local_crates=oasis7_client_launcher,pixel_world_bridge
  "RUSTSEC-2026-0195", # quick-xml namespace allocation DoS via wayland-scanner
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["Apache-2.0", "MIT", "OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts@0.33.3" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
